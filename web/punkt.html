function tagDetail(k){const d=S.days[k];const out=[];
  if(d.anker)out.push('<p class="small muted">Morgenanker '+d.anker.at+' · '+d.anker.min+' Min. · '+STUFE_NAME[d.anker.variante||'gruen']+'</p>');
  if(d.journal){out.push('<h4>Morgen</h4>');(d.journal.fragen||fragen()).forEach((f,i)=>{const key=i?'b':'a';out.push('<p><strong>'+esc(f)+'</strong><br>'+esc(d.journal[key]||'')+(d.journal['aud_'+key]?' <span class="chip purple">Sprachnotiz '+mss(d.journal['aud_'+key])+'</span>':'')+'</p>');});}
  if(d.skala)out.push('<p class="small">Skala: '+ITEMS.map(i=>i.name+' '+d.skala[i.k]).join(' · ')+'</p>');
  if(d.haupt.length){out.push('<h4>Übungen</h4>');d.haupt.forEach(h=>out.push('<p>'+esc(h.at)+' · '+esc(uebName(h.typ))+' · '+h.min+' Min.'+(h.qualitaet!=null?' · Qualität '+h.qualitaet:'')+(h.gestoert?' · gestört':'')+(h.ort?' · '+ORT_NAME[h.ort]:'')+(h.text?'<br><span class="soft">'+esc(h.text)+'</span>':'')+'</p>'));}
  if(d.begeg&&d.begeg.length){out.push('<h4>Begegnungen</h4>');d.begeg.forEach(b=>out.push('<p>'+esc(b.at)+' · '+esc(bKatName(b.kat))+' · gewahr '+BGEW[b.gew]+' · '+bRueck(b.rueck)+'× zurück · Kontakt '+(b.kon==='ferner'?'<strong style="color:var(--pink)">ferner</strong>':BKON[b.kon])+(b.aus?' · '+esc(b.aus):'')+(b.text?'<br><span class="soft">'+esc(b.text)+'</span>':'')+(b.aud?' <span class="chip purple">Sprachnotiz '+mss(b.aud)+'</span>':'')+'</p>'));}
  if(d.schwellen&&d.schwellen.length)out.push('<p class="small muted">Schwellen-Anker: '+d.schwellen.map(x=>esc(x.at+' '+(x.name||''))).join(' · ')+'</p>');
  if(d.notizen.length){out.push('<h4>Notizen</h4>');d.notizen.forEach(x=>out.push('<p>'+esc(x.at)+' · '+esc(x.text)+(x.aud?' <span class="chip purple">Sprachnotiz '+mss(x.aud)+'</span>':'')+'</p>'));}
  if(d.abend)out.push('<h4>Abend</h4><p><strong>Wo habe ich mich heute identifiziert?</strong><br>'+esc(d.abend.a||'')+'</p><p><strong>Was blieb unberührt?</strong><br>'+esc(d.abend.b||'')+'</p>');
  if(d.begr.length){out.push('<h4>Begründungen</h4>');d.begr.forEach(b=>out.push('<p>'+esc(b.at)+' · '+esc(anlassText(b))+'<br>„'+esc(b.text)+'“'+(b.stichwort?' <span class="chip pink">'+esc(b.stichwort)+'</span>':'')+'</p>'));}
  if(d.impulse&&d.impulse.n)out.push('<p class="small muted">Tagesimpulse: '+d.impulse.b+' von '+d.impulse.n+' bemerkt</p>');
  if(d.bimp&&d.bimp.n)out.push('<p class="small muted">Stiller Impuls: '+d.bimp.b+' von '+d.bimp.n+' bemerkt</p>');
  return out.join('')||'<p class="muted small">Keine Einträge.</p>';}

/* ---------- Wochencheck ---------- */
function begrIn(from,to){const out=[];for(const k of range(from,to)){const d=peek(k);if(d)d.begr.forEach(b=>out.push(Object.assign({tag:k},b)));}return out;}
function vorigerCheck(T){return S.checks[weekStart(addDays(T,-7))]||null;}
function ampelWoche(T,cds,items){const from=addDays(T,-6);const warn={k:0,w:0,g:0,s:0,u:0};
  for(const k of range(from,T)){const d=peek(k);if(d&&d.skala)for(const x of Object.keys(warn))if(istWarn(x,d.skala[x]))warn[x]++;}
  const rot=[],gelb=[],nah=[];const cdsSum=(cds[0]||0)+(cds[1]||0);const name=k=>ITEMS.find(i=>i.k===k).name;
  if(cdsSum>=5)rot.push('Unwirklichkeit: Summe '+cdsSum+', Rot ab 5');else if(cdsSum>=3)gelb.push('Unwirklichkeit: Summe '+cdsSum+', Gelb ab 3');
  if(warn.w>=5)rot.push(haeufText('w',warn.w));
  for(const x of Object.keys(warn)){if(warn[x]>=3&&!(x==='w'&&warn.w>=5))gelb.push(haeufText(x,warn[x]));if(warn[x]===2)nah.push(haeufText(x,2)+', Gelb ab 3');}
  if((items.bypass||0)>=3)gelb.push('Gefühle spirituell beiseitegeschoben: '+items.bypass+', Gelb ab 3');
  if((items.ueber||0)>=3)gelb.push('Überlegenheitsgefühl: '+items.ueber+', Gelb ab 3');
  const fl=S.flags.filter(f=>f.status==='bestaetigt'&&f.am>=from);if(fl.length)gelb.push('Bestätigter KI-Befund: '+fl.map(f=>SIGNAL[f.signal]||f.signal).join(', '));
  const fern=bFern(T);if(fern>=3)gelb.push('Kontakt in Begegnungen '+fern+'× ferner, Gelb ab 3');else if(fern===2)nah.push('Kontakt in Begegnungen 2× ferner, Gelb ab 3');
  const v=vorigerCheck(T);if(gelb.length&&!rot.length&&v&&v.ampel==='gelb')rot.push('Gelb zwei Wochen in Folge');
  const stufe=rot.length?'rot':gelb.length?'gelb':'gruen';return{stufe:stufe,gruende:rot.length?rot:gelb,nah:nah,warn:warn,cdsSum:cdsSum};}
function musterAuswerten(T){const woche=begrIn(addDays(T,-6),T);const vier=begrIn(addDays(T,-27),T);
  const prev=[1,2,3].map(i=>begrIn(addDays(T,-6-7*i),addDays(T,-7*i)).length);const muster=[];
  if(woche.length>=3)muster.push({regel:'haeufung',text:woche.length+' Begründungen in 7 Tagen.',frage:'Was sagen dir diese Sätze nebeneinander?'});
  const c1={},c4={};woche.forEach(b=>{if(b.stichwort)c1[b.stichwort]=(c1[b.stichwort]||0)+1;});vier.forEach(b=>{if(b.stichwort)c4[b.stichwort]=(c4[b.stichwort]||0)+1;});
  Object.keys(c4).forEach(w=>{if((c1[w]||0)>=2||c4[w]>=3)muster.push({regel:'stichwort',text:(c1[w]||0)>=2?c1[w]+'× „'+w+'“ in dieser Woche.':c4[w]+'× „'+w+'“ in vier Wochen.',frage:w==='keine Zeit'?'Passt das Stammfenster noch?':'Was steckt hinter „'+w+'“?'});});
  const ub={};woche.forEach(b=>{if(b.uebung)ub[b.uebung]=(ub[b.uebung]||0)+1;});Object.keys(ub).forEach(u=>{if(ub[u]>=2)muster.push({regel:'ort',text:ub[u]+'× ausgelassen: '+uebName(u)+'.',frage:'Tag oder Übung tauschen?'});});
  const wt={};vier.forEach(b=>{const w=dow(b.tag);wt[w]=(wt[w]||0)+1;});Object.keys(wt).forEach(w=>{if(wt[w]>=3)muster.push({regel:'ort',text:'Immer '+WT_LANG[w].toLowerCase()+'s: '+wt[w]+'× in vier Wochen.',frage:'Was ist '+WT_LANG[w].toLowerCase()+'s anders?'});});
  const trend=woche.length>=2&&prev.every(p=>woche.length>p);if(trend)muster.push({regel:'trend',text:'Mehr Begründungen als in jeder der drei Vorwochen: '+prev.slice().reverse().join(', ')+', jetzt '+woche.length+'.',frage:'Ist der Plan gerade zu viel?'});
  const v=vorigerCheck(T);let passung=muster.length?'pruefen':'passt';
  if(muster.length&&(trend||woche.length>=5||(v&&v.passung&&v.passung!=='passt')))passung='aendern';
  return{woche:woche,muster:muster,passung:passung,prev:prev};}
function offeneUebungen(T){const ws=weekStart(T),out=[];const n=id=>sessionsIn(ws,T,id);
  if(S.phase==='1'&&n('harding')<1)out.push({id:'harding',titel:'Harding-Experiment'});
  if(S.phase==='2'&&n('metta')<2)out.push({id:'metta',titel:'Metta mit Wendung, '+n('metta')+' von 2'});
  if(S.phase==='3'){if(n('schatten')<1)out.push({id:'schatten',titel:'Schattenarbeit'});if(n('scheitern')<1)out.push({id:'scheitern',titel:'Scheitern riskieren'});}
  const h=sessionsIn(addDays(T,-6),T,'haupt');let hb=0;for(const k of range(addDays(T,-6),T)){const d=peek(k);if(d)hb+=d.begr.filter(b=>b.uebung==='haupt').length;}
  if(h+hb<3)out.push({id:'haupt',titel:'Hauptpraxis, '+h+' von 3 in 7 Tagen'+(hb?' ('+hb+' schon begründet)':'')});
  if(S.phase!=='probe'){const nb=bIn(addDays(T,-6),T).length;if(nb<3)out.push({id:'begegnung',titel:'Begegnungen, '+nb+' von 3 notiert'});}
  return out;}

  const hochOk=s<5&&z.length>=4&&fernZ<=1;const erlaubt=s<bMax();
  const aus={};w.forEach(b=>{if(b.aus)aus[b.aus]=(aus[b.aus]||0)+1;});const top=Object.keys(aus).sort((a,b)=>aus[b]-aus[a])[0]||null;
  const proKat=BKAT.map(c=>{const x=w.filter(b=>b.kat===c.k);return{k:c.k,name:c.name,n:x.length,gut:x.filter(b=>b.gew>=2).length,rueck:x.reduce((q,b)=>q+(b.rueck||0),0)};}).filter(x=>x.n);
  return{n:w.length,z:z.length,quote:quote,fern:w.filter(b=>b.kon==='ferner').length,hochOk:hochOk,erlaubt:erlaubt,angebot:hochOk&&erlaubt&&astufe==='gruen',aus:aus,top:top,topN:top?aus[top]:0,proKat:proKat};}

  const minOk=i.tag>=minWochen()*7;const lang=S.runde>1&&i.tag>=56;let abs=0,ges=0;for(const k of range(S.phaseStart||T,T)){ges++;const d=peek(k);if(d&&d.anker)abs++;}
  const quote=ges?abs/ges:0;const v=vorigerCheck(T);const gruen2=stufe==='gruen'&&(S.phase==='probe'||(v&&v.ampel==='gruen'));
  const stammOk=S.settings.stamm.tage.length>0;
  return{minOk:minOk,lang:lang,quote:quote,gruen2:gruen2,stammOk:stammOk,next:def.next,ok:minOk&&quote>=.8&&gruen2&&(S.phase!=='probe'||stammOk)};}

  else if(w.s===4){w.antwort=ui.f.antwort||null;w.aend=ui.f.aend||null;w.bg=begAuswertung(T,w.erg.stufe);ui.f.stufeHoch=null;w.s=5;}
  else if(w.s===5){w.stufeHoch=ui.f.stufeHoch===true;w.phase=phasePruefung(T,w.erg.stufe);ui.f.krit=null;ui.f.wechsel=null;w.s=6;}
  else if(w.s===6){w.wechsel=ui.f.wechsel===true&&(ui.f.krit===0||!!(w.phase&&w.phase.lang));wcAbschluss();w.s=7;}
  if(w.s===3&&!w.erg)w.erg=ampelWoche(T,w.cds,w.items);
  const keep={cds0:ui.f.cds0,cds1:ui.f.cds1};WOCHENITEMS.forEach(x=>{keep['wi_'+x.k]=ui.f['wi_'+x.k];});
  if(w.s>=3){ui.f=Object.assign({},keep,{antwort:ui.f.antwort,aend:ui.f.aend,krit:ui.f.krit,wechsel:ui.f.wechsel,stufeHoch:ui.f.stufeHoch});}
  render();const a=document.getElementById('app');if(a)a.scrollTop=0;}
function aenderungAnwenden(aid,T,basis){const a=AENDERUNGEN.find(x=>x.id===aid);if(!a)return null;const morgen=addDays(T,1);S.aenderungen.push({woche:T,id:a.id,text:a.text,wirkung:'offen',basis:basis});
  if(a.id==='kuerzer')S.settings.hauptKurz=true;if(a.id==='morgen')S.settings.morgen=Math.min(8,S.settings.morgen+1);if(a.id==='impulse')S.settings.impulse=Math.max(0,S.settings.impulse-5);
  if(a.id==='zurueck'&&S.phase!=='probe')wechsleZurueck(morgen);if(a.id==='fenster')setTimeout(()=>toast('Wähle dein neues Stammfenster in den Optionen.'),3800);return a.art+': '+a.text;}
function wcAbschluss(){const w=ui.wc;const T=w.T;const m=w.muster;const e=w.erg;const morgen=addDays(T,1);
  const bg=w.bg;let bHoch=false;if(bg){if(w.stufeHoch&&bg.angebot){S.begegnung.stufe=bStufe()+1;S.begegnung.stufeAb=T;bHoch=true;}S.begegnung.merk=S.begegnung.merk.filter(x=>x.woche!==T);if(bg.top&&bg.topN>=2)S.begegnung.merk.push({woche:T,ausloeser:bg.top,n:bg.topN});}
  setAmpel(e.stufe,morgen,e.gruende.length?e.gruende[0]:'Kein Auslöser aktiv');
  let aendText=null;if(w.aend)aendText=aenderungAnwenden(w.aend,T,m.woche.length);
  if(w.wechsel&&w.phase&&w.phase.ok){const von=S.phase;S.phase=w.phase.next;S.phaseStart=morgen;if(S.phase==='1'&&!S.phase1Start)S.phase1Start=morgen;if(von==='3')S.runde=(S.runde||1)+1;}
  S.checks[weekStart(T)]={datum:T,ampel:e.stufe,gruende:e.gruende,cds:w.cds,items:w.items,passung:m.passung,muster:m.muster.map(x=>x.text),antwort:w.antwort,aenderung:aendText,wechsel:!!(w.wechsel&&w.phase&&w.phase.ok),begegnung:bg?{n:bg.n,fern:bg.fern,stufe:S.begegnung.stufe,hoch:bHoch}:null};
  save();}

<script>
'use strict';
/* ---------- KI ---------- */
function namenErsetzen(t){const n=S.settings.namen.split(',').map(s=>s.trim()).filter(Boolean);n.forEach((x,i)=>{try{const re=new RegExp('(?<![\\p{L}])'+x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}])','giu');t=t.replace(re,'[Person '+(i+1)+']');}catch(e){}});return t;}
function kiDaten(T){const from=addDays(T,-6);const L=[];
  for(const k of range(from,T)){const d=peek(k);if(!d)continue;const p=[];
    if(d.journal){const f=d.journal.fragen||fragen();if(d.journal.a)p.push('Morgen, „'+f[0]+'“: '+d.journal.a);if(d.journal.b)p.push('Morgen, „'+f[1]+'“: '+d.journal.b);if(d.journal.aud_a||d.journal.aud_b)p.push('(Sprachnotiz vorhanden, Transkript in der Testversion nicht verfügbar)');}
    d.haupt.forEach(h=>{if(h.text)p.push(uebName(h.typ)+': '+h.text);});
    (d.begeg||[]).forEach(b=>p.push('Begegnung '+b.at+' ('+bKatName(b.kat)+', gewahr: '+BGEW[b.gew]+', Rückkehren: '+bRueck(b.rueck)+', Kontakt: '+BKON[b.kon]+(b.aus?', herausgezogen durch: '+b.aus:'')+')'+(b.text?': '+b.text:'')));
    d.notizen.forEach(x=>{if(x.text)p.push('Notiz '+x.at+': '+x.text);});
    if(d.abend){if(d.abend.a)p.push('Abend, „Wo habe ich mich heute identifiziert?“: '+d.abend.a);if(d.abend.b)p.push('Abend, „Was blieb unberührt?“: '+d.abend.b);}
    d.begr.forEach(b=>p.push('Begründung ('+ANLASS[b.anlass]+(b.stichwort?', '+b.stichwort:'')+'): '+b.text));
    if(d.skala)p.push('Tagesskala 0–4: '+ITEMS.map(i=>i.name+' '+d.skala[i.k]).join(', '));
    if(p.length)L.push('### '+fmtShort(k)+'\n'+p.join('\n'));}
  const ck=S.checks[weekStart(T)];let kopf='';if(ck)kopf='Wochenwerte: Unwirklichkeit (2 Fragen, Summe 0–10) '+((ck.cds[0]||0)+(ck.cds[1]||0))+', Gefühle spirituell beiseitegeschoben '+ck.items.bypass+'/4, Überlegenheitsgefühl '+ck.items.ueber+'/4, Frust über ausbleibende Zustände '+ck.items.frust+'/4.\n\n';
  let t=kopf+(L.join('\n\n')||'(Keine Einträge in dieser Woche.)');if(ui.ki&&ui.ki.ersetzen)t=namenErsetzen(t);return t;}
function kiPrompt(daten){return 'Du unterstützt eine Person bei der Selbstbeobachtung ihrer Meditationspraxis. Sie geht einen nondualen Übungsweg mit Körper-Erkundung, Leere-Übung und Selbstergründung. Lies die Einträge einer Woche und suche nach Warnsignalen. Stelle keine Diagnosen.\n\nSignaltypen: depersonalisation, derealisation, bypassing, spirituelles_ego, zustands_frust, flucht, uebererregung.\n\nRegeln:\n- Unterscheide gewöhnliche Meditationserfahrungen wie Weite, Stille oder ein leiseres Ich-Gefühl von Warnmustern wie Taubheit, Unwirklichkeit mit Leidensdruck, Rückzug oder Gleichgültigkeit.\n- Jeder Befund braucht einen wörtlichen Beleg aus den Einträgen (höchstens 25 Wörter) und das Datum.\n- Benenne Unsicherheit. Lieber kein Befund als ein unsicherer.\n- Begründungen fürs Auslassen sind nur dann ein Befund, wenn sie selbst ein Warnsignal enthalten.\n- Begegnungsnotizen: Kontakt „ferner“ oder Beschreibungen wie „hinter Glas“ können auf Depersonalisation oder Bypassing hinweisen. Wenig Gewahrsein im Gespräch ist dagegen normal und kein Warnsignal.\n- Schreib auf Deutsch, in der Du-Form, sachlich und freundlich.\n\nAntworte nur mit JSON in dieser Form:\n{"befunde":[{"signal":"zustands_frust","beleg":"…","datum":"Fr 2.10.","sicherheit":"niedrig|mittel|hoch","einordnung":"ein bis zwei Sätze"}],"zusammenfassung":"ein Satz dazu, was sich in dieser Woche nicht als Warnsignal zeigt"}\nWenn nichts auffällt, ist "befunde" eine leere Liste.\n\nEinträge der Woche:\n\n'+daten;}
function kiParse(t){try{const s=t.indexOf('{'),e=t.lastIndexOf('}');if(s<0||e<s)return null;const o=JSON.parse(t.slice(s,e+1));if(!Array.isArray(o.befunde))return null;return o;}catch(e){return null;}}
V.ki=()=>{const k=ui.ki||(ui.ki={ersetzen:true,status:'idle',erg:null,fehler:''});const T=today();const daten=kiDaten(T);const hatNamen=!!S.settings.namen.trim();
  let unten='';
  if(k.status==='laeuft')unten='<section class="card"><p class="status"><span class="dot" style="background:var(--pink)"></span>Claude denkt nach. Das dauert meist unter einer Minute.</p><button type="button" class="btn sec small" data-a="kiStop">Stopp</button></section>';
  else if(k.erg){unten='<h2 class="h2">'+(k.erg.befunde.length?k.erg.befunde.length===1?'Ein Befund':k.erg.befunde.length+' Befunde':'Keine Befunde')+'</h2><p class="small muted">Keine Diagnose. Du entscheidest, ob ein Befund zählt.</p>'+
    k.erg.befunde.map((b,i)=>'<article class="card"><div class="row between"><span class="chip pink">'+esc(SIGNAL[b.signal]||b.signal)+'</span><span class="xs muted">Sicherheit: '+esc(b.sicherheit||'–')+'</span></div><blockquote class="quote">„'+esc(b.beleg)+'“</blockquote><span class="xs muted">'+esc(b.datum||'')+'</span><p class="small">'+esc(b.einordnung||'')+'</p>'+
      (b._st?'<p class="small chip '+(b._st==='ja'?'warn':'')+'" role="status">'+(b._st==='ja'?'Bestätigt. Ab morgen Ampel mindestens gelb.':'Verworfen. Bleibt im Protokoll.')+'</p>':'<div class="btnrow"><button type="button" class="btn small" data-a="kiJa" data-v="'+i+'">Bestätigen</button><button type="button" class="btn sec small" data-a="kiNein" data-v="'+i+'">Verwerfen</button></div>')+'</article>').join('')+
    (k.erg.zusammenfassung?'<p class="small">'+esc(k.erg.zusammenfassung)+'</p>':'')+'<button type="button" class="btn sec" data-a="go" data-v="check">Fertig</button>';}
  else unten=(SAMPLE?'<button type="button" class="btn" data-a="kiSenden">Mit Claude auswerten</button><p class="xs muted">Läuft über dein Claude-Konto und zählt zu deiner Nutzung.</p>':'<p class="small muted">Die direkte Auswertung ist in dieser Ansicht nicht verfügbar. Kopier den Auftrag in einen Chat und füge die Antwort unten ein.</p>')+
    '<button type="button" class="btn sec" data-a="kiKopie">Als Text kopieren</button>'+feld('kiPaste','Antwort einfügen',0,{mic:false,ph:'Die JSON-Antwort aus dem Chat hier einfügen'})+'<button type="button" class="btn sec small" data-a="kiEinlesen">Antwort einlesen</button>'+(k.fehler?'<p class="small" style="color:var(--crit)">'+esc(k.fehler)+'</p>':'');
  return '<div class="scr"><div class="row between"><button type="button" class="link" data-a="go" data-v="check">Zurück</button><span class="small muted">'+fmtShort(addDays(T,-6))+'–'+fmtShort(T)+'</span></div><div class="col" style="gap:6px"><h1 class="h1s">KI-Auswertung</h1><p class="small muted">Erst nach deinem Tippen. Genau dieser Text, nichts sonst.</p></div>'+
  '<pre class="pre" tabindex="0" aria-label="Vorschau des Texts">'+esc(daten)+'</pre>'+
  (hatNamen?'<label class="tog"><input type="checkbox" '+(k.ersetzen?'checked':'')+' data-a="kiErsetzen"> Namen durch Platzhalter ersetzen</label>':'<p class="xs muted">Tipp: Trag in den Einstellungen Namen ein, dann ersetzt die App sie vor dem Senden.</p>')+unten+'</div>';};
let KICTL=null;
async function kiSenden(){const k=ui.ki;if(!SAMPLE)return;k.status='laeuft';k.fehler='';render();KICTL=new AbortController();
  try{const o=await SAMPLE.json(kiPrompt(kiDaten(today())),{modelTier:'complex',signal:KICTL.signal,cache:false});if(!o||!Array.isArray(o.befunde))throw{code:'invalid_json'};k.erg=o;k.status='fertig';}
  catch(e){k.status='idle';const c=e&&e.code;k.fehler=c==='cancelled'?'':c==='not_granted'||c==='sampling_disabled'?'Die Auswertung wurde nicht erlaubt. Nutze den Weg über den Chat.':c==='rate_limited'?'Gerade zu viele Anfragen. Versuch es später noch einmal.':c==='invalid_json'?'Die Antwort war kein gültiges JSON. Versuch es noch einmal.':'Die Auswertung ist fehlgeschlagen. Versuch es später noch einmal.';if(c==='not_granted'||c==='sampling_disabled')SAMPLE=null;}
  render();}
function kiEntscheid(i,ja){const k=ui.ki;const b=k.erg.befunde[i];b._st=ja?'ja':'nein';S.flags.push({id:uid(),signal:b.signal,beleg:b.beleg,datum:b.datum,sicherheit:b.sicherheit,einordnung:b.einordnung,status:ja?'bestaetigt':'verworfen',am:today()});
  if(ja&&erhoeheAmpel('gelb','Bestätigter KI-Befund: '+(SIGNAL[b.signal]||b.signal)))toast('Ab morgen Ampel gelb.');save();render();}

/* ---------- Export ---------- */
function mdTag(k){const d=S.days[k];const L=['---','datum: '+k,'phase: '+(d.phase||''),'ampel: '+ampelAm(k).stufe,d.skala?'skala: {koerper: '+d.skala.k+', wirklichkeit: '+d.skala.w+', gefuehle: '+d.skala.g+', schlaf: '+d.skala.s+', unruhe: '+d.skala.u+'}':'skala: null','notausgang: '+!!d.notausgang,'---'];
  if(d.anker)L.push('','Morgenanker '+d.anker.at+', '+d.anker.min+' Min.');
  if(d.journal){L.push('','## Morgen');(d.journal.fragen||fragen()).forEach((f,i)=>{const key=i?'b':'a';L.push('**'+f+'**');if(d.journal[key])L.push(d.journal[key]);if(d.journal['aud_'+key])L.push('_Sprachnotiz '+mss(d.journal['aud_'+key])+'_');L.push('');});}
  if(d.haupt.length){L.push('## Übungen');d.haupt.forEach(h=>L.push('- '+h.at+' · '+uebName(h.typ)+' · '+h.min+' Min.'+(h.qualitaet!=null?' · Qualität '+h.qualitaet:'')+(h.gestoert?' · gestört':'')+(h.text?'\n  '+h.text:'')));L.push('');}
  if(d.begeg&&d.begeg.length){L.push('## Begegnungen');d.begeg.forEach(b=>L.push('- '+b.at+' · '+bKatName(b.kat)+' · gewahr '+BGEW[b.gew]+' · '+bRueck(b.rueck)+'× zurück · Kontakt '+BKON[b.kon]+(b.aus?' · '+b.aus:'')+(b.aud?' _(Sprachnotiz '+mss(b.aud)+')_':'')+(b.text?'\n  '+b.text:'')));L.push('');}
  if(d.schwellen&&d.schwellen.length)L.push('Schwellen-Anker: '+d.schwellen.map(x=>x.at+' '+(x.name||'')).join(', '),'');
  if(d.notizen.length){L.push('## Notizen');d.notizen.forEach(x=>L.push('- '+x.at+' '+x.text+(x.aud?' _(Sprachnotiz '+mss(x.aud)+')_':'')));L.push('');}
  if(d.abend){L.push('## Abend','**Wo habe ich mich heute identifiziert?**',d.abend.a||'','','**Was blieb unberührt?**',d.abend.b||'','');}
  if(d.begr.length){L.push('## Begründungen');d.begr.forEach(b=>L.push('- '+b.at+' · '+anlassText(b)+' · „'+b.text+'“'+(b.stichwort?' · '+b.stichwort:'')));L.push('');}
  if(d.impulse&&d.impulse.n)L.push('## Tagesimpulse','bemerkt: '+d.impulse.b+' von '+d.impulse.n);
  if(d.bimp&&d.bimp.n)L.push('Stiller Impuls: '+d.bimp.b+' von '+d.bimp.n+' bemerkt');
  return L.join('\n');}
async function speichereDatei(name,data){if(NATIVE){toast(nat('speichere',name,data)?'Gespeichert in Downloads/Punkt: '+name:'Speichern ist fehlgeschlagen.');return;}if(DOWNLOADS){try{await DOWNLOADS.save({filename:name,data:data});toast('Gespeichert: '+name);return;}catch(e){if(e&&e.code==='declined')return;}}
  try{await kopiere(data);toast('Speichern ist hier nicht möglich. Der Inhalt liegt in der Zwischenablage.');}catch(e){toast('Speichern und Kopieren sind in dieser Ansicht nicht möglich.');}}

/* ---------- Modals ---------- */
function renderOverlay(){const o=document.getElementById('overlay');const m=ui.modal||(S.pending?{typ:'begr',anlass:S.pending.anlass,then:'gateAus'}:null);if(!m){o.innerHTML='';return;}
  if(m.typ==='begr'){o.innerHTML='<div class="modalbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mb-t"><span class="eyebrow">'+esc(ANLASS[m.anlass])+'</span><h2 class="h2" id="mb-t">'+esc(ANLASS_FRAGE[m.anlass])+'</h2>'+feld('mb','Ein Satz, mindestens 20 Zeichen',20,{mic:false})+'<p class="lab">Stichwort <span class="muted" style="font-weight:400">· optional</span></p>'+stichChips('mbStich')+'<button type="button" class="btn" data-a="mbOk" data-ready="mb">Speichern</button>'+(m.then==='gateAus'?'':'<button type="button" class="link quiet" data-a="modalZu">Abbrechen</button>')+'</div></div>';}
  else if(m.typ==='notiz'){o.innerHTML='<div class="modalbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mn-t"><h2 class="h2" id="mn-t">Schnellnotiz</h2>'+feld('mn','Was ist gerade da?',0)+'<div class="btnrow"><button type="button" class="btn sec" data-a="modalZu">Abbrechen</button><button type="button" class="btn" data-a="notizOk">Speichern</button></div></div></div>';}
  else if(m.typ==='scheitern'){o.innerHTML='<div class="modalbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ms-t"><h2 class="h2" id="ms-t">Scheitern riskiert</h2><p class="small muted">Etwas Ungeübtes vor anderen, oder zu Hause einen Fehler zugegeben, ohne ihn zu erklären.</p>'+feld('ms','Was hast du riskiert, und wem ist es geschehen?',0)+'<div class="btnrow"><button type="button" class="btn sec" data-a="modalZu">Abbrechen</button><button type="button" class="btn" data-a="scheiternOk">Speichern</button></div></div></div>';}
  else if(m.typ==='confirm'){o.innerHTML='<div class="modalbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mc-t"><h2 class="h2" id="mc-t">'+esc(m.titel)+'</h2><p class="soft">'+esc(m.text)+'</p><div class="btnrow"><button type="button" class="btn sec" data-a="modalZu">Abbrechen</button><button type="button" class="btn pink" data-a="confirmOk">'+esc(m.ok)+'</button></div></div></div>';}
  else if(m.typ==='schwelle'){const t=ui.f.swTyp;o.innerHTML='<div class="modalbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mw-t"><h2 class="h2" id="mw-t">Neue Schwelle</h2><label class="lab" for="f-swName">Übergang</label><input type="text" id="f-swName" data-f="swName" data-min="2" value="'+esc(ui.f.swName||'')+'" placeholder="zum Beispiel Teamsitzung">'+
    '<p class="lab">Auslöser</p>'+seg('swTyp',['zeit','nfc','ort'],['Uhrzeit','NFC','Ort'],3)+
    (t==='zeit'?'<label class="small muted" for="f-swZeit">Uhrzeit, Mo–Fr</label><input type="time" id="f-swZeit" data-f="swZeit" data-min="5" value="'+esc(ui.f.swZeit||'')+'">':'<label class="small muted" for="f-swOrt">'+(t==='nfc'?'Wo klebt der Aufkleber?':'Welcher Ort?')+'</label><input type="text" id="f-swOrt" data-f="swOrt" data-min="0" value="'+esc(ui.f.swOrt||'')+'" placeholder="'+(t==='nfc'?'zum Beispiel Bürotür':'zum Beispiel Parkplatz an der Arbeit')+'">')+
    '<p class="xs muted">'+(t==='zeit'?'Das Handy erinnert zwei Minuten vorher.':t==='nfc'?'Das Handy an den Aufkleber halten startet den Anker.':'Die Erinnerung kommt bei der Ankunft. Der Standort bleibt auf dem Gerät.')+'</p>'+
    '<div class="btnrow"><button type="button" class="btn sec" data-a="modalZu">Abbrechen</button><button type="button" class="btn" data-a="swOk" data-ready="'+(t==='zeit'?'swName,swZeit':'swName')+'">Speichern</button></div></div></div>';}

  abendOk:()=>{stopRec();day().abend={a:(ui.f.ea||'').trim(),b:(ui.f.eb||'').trim(),aud_a:ui.f.aud_ea||0,aud_b:ui.f.aud_eb||0,at:hm(now())};save();go('heute');toast('Abend-Rückschau gespeichert.');},
  schattenStart:()=>{ensureAudio();ui.schatten={i:0};go('schatten');},
  schattenWeiter:()=>{ui.schatten.i++;rerender();},
  schattenZurueck:()=>{ui.schatten.i=Math.max(0,ui.schatten.i-1);rerender();},
  schattenOk:()=>{const t=[ui.f.s3?'Was die Gestalt sagte: '+ui.f.s3.trim():'',ui.f.s4?'Was sie braucht: '+ui.f.s4.trim():''].filter(Boolean).join(' ');day().haupt.push({typ:'schatten',min:25,at:hm(now()),text:t,gestalt:gestalt()});ui.schatten=null;save();go('heute');toast('Schattenarbeit gespeichert.');},
  angstStart:()=>{ensureAudio();ui.angst={i:0};ui.modal=null;go('angst');},
  angstWeiter:()=>{ui.angst.i++;rerender();},
  angstOk:()=>{const t=(ui.f.ag||'').trim();day().haupt.push({typ:'angst',min:3,at:hm(now()),text:t});ui.angst=null;save();go('heute');toast('Angst-Protokoll gespeichert.');},
  info:el=>{const k=el.dataset.v;ui.info[k]=!ui.info[k];rerender();},
  tagAuf:el=>{const k=el.dataset.v;ui.offen[k]=!ui.offen[k];render();},
  wcStart:()=>wcStart(),
  wcWeiter:()=>wcWeiter(),
  kiStart:()=>{ui.ki=null;go('ki');},
  kiErsetzen:()=>{ui.ki.ersetzen=!ui.ki.ersetzen;render();},
  kiSenden:()=>kiSenden(),
  kiStop:()=>{if(KICTL)KICTL.abort();},
  kiKopie:()=>{const t=kiPrompt(kiDaten(today()));kopiere(t).then(()=>toast('Auftrag kopiert. In einen Chat einfügen, Antwort unten eintragen.')).catch(()=>toast('Kopieren ist hier nicht möglich.'));},
  kiEinlesen:()=>{const o=kiParse(ui.f.kiPaste||'');if(!o){ui.ki.fehler='Kein gültiges JSON gefunden. Füge die ganze Antwort ein.';render();return;}ui.ki.erg=o;ui.ki.fehler='';render();},
  kiJa:el=>kiEntscheid(Number(el.dataset.v),true),
  kiNein:el=>kiEntscheid(Number(el.dataset.v),false),
  exportMd:()=>{const keys=Object.keys(S.days).sort();if(!keys.length){toast('Noch keine Einträge.');return;}speichereDatei('punkt-journal-'+today()+'.md',keys.map(mdTag).join('\n\n'));},
  exportJson:()=>speichereDatei('punkt-backup-'+today()+'.json',JSON.stringify(S,null,1)),
  stammTag:el=>{const i=Number(el.dataset.v);const t=S.settings.stamm.tage;const idx=t.indexOf(i);if(idx>=0)t.splice(idx,1);else t.push(i);t.sort();save();render();},
  eKurz:el=>{const an=!S.settings.hauptKurz;if(an){ui.lockern=()=>{S.settings.hauptKurz=true;};ui.modal={typ:'begr',anlass:'gelockert',then:'lockern'};ui.f={};render();}else{S.settings.hauptKurz=false;save();render();}},
  phaseZurueck:()=>{if(S.phase==='probe')return;wechsleZurueck(today());save();render();toast('Jetzt: '+PHASEN[S.phase].name);},
  stammUebernehmen:()=>{const v=stammVorschlag();if(v){S.settings.stamm={tage:v.tage.sort(),zeit:v.zeit};save();toast('Stammfenster: '+v.tage.map(t=>WT[t]).join(', ')+' '+v.zeit);}},
  confirmOk:()=>{const m=ui.modal;ui.modal=null;if(m.ok==='Zurücksetzen'){const keep=S.sim;S=defaultState();S.sim=keep;SES=null;save();go('auto');toast('Alles zurückgesetzt.');}else if(m.daten){S=mergeState(m.daten);save();go('auto');toast('Backup eingespielt.');}},
  impulsJa:()=>{const d=day();d.impulse.b++;save();ui.modal.bemerkt=true;renderOverlay();},
  // Testpanel
  tMorgen:()=>setZeit(nachstMorgen()),
  tStunde:()=>setZeit(new Date(now().getTime()+36e5)),
  tTag:()=>setZeit(new Date(now().getTime()+864e5)),
  tAbend:()=>{const d=new Date(now());d.setHours(21,0,0,0);if(d<=now())d.setDate(d.getDate()+1);setZeit(d);},
  tStamm:()=>{const n=now();const [h,m]=S.settings.stamm.zeit.split(':').map(Number);const tage=S.settings.stamm.tage.length?S.settings.stamm.tage:[dow(keyOf(n))];for(let i=0;i<8;i++){const d=new Date(n);d.setDate(d.getDate()+i);d.setHours(h,m,0,0);if(d>n&&tage.includes(dow(keyOf(d)))){setZeit(d);return;}}},
  tSonntag:()=>{const n=now();const d=new Date(n);d.setDate(d.getDate()+((6-dow(keyOf(n)))+7)%7);d.setHours(19,0,0,0);if(d<=n)d.setDate(d.getDate()+7);setZeit(d);},
  tEcht:()=>{S.sim.offset=0;save();go('auto');},
  pFace:()=>{S.sim.faceDown=!S.sim.faceDown;save();if(ui.route==='session'){const x=SES&&SES.plan[SES.i];const stt=document.getElementById('s-status');if(stt&&x)stt.innerHTML=sesStatus(x,stepFertig(x));}renderPanel();},
  pDemo:()=>{S.settings.demo=!S.settings.demo;save();render();},
  pNfc:()=>{if(ui.route==='gate'){const d=peek(today());if(!d||!d.anker)startSession('anker','nfc');}else toast('Der Aufkleber startet den Morgenanker im Gate.');},
  pImpuls:()=>{if(!S.created){toast('Erst die Probephase beginnen.');return;}const d=day();d.impulse.n++;save();ui.modal={typ:'impuls'};renderOverlay();},
  pSchwelle:()=>{if(!S.created){toast('Erst die Probephase beginnen.');return;}if(gateAktiv()){toast('Erst das Morgen-Gate abschließen.');return;}const L=S.begegnung.schwellen;if(!L.length){toast('Keine Schwellen angelegt.');return;}ui.swRot=((ui.swRot==null?-1:ui.swRot)+1)%L.length;ui.modal={typ:'swHinweis',id:L[ui.swRot].id};renderOverlay();},
  pBImpuls:()=>{if(!S.created){toast('Erst die Probephase beginnen.');return;}const d=day();d.bimp.n++;save();try{if(navigator.vibrate)navigator.vibrate([90,140,90,140,320]);}catch(e){}ui.modal={typ:'bimpuls'};renderOverlay();},
  pGateAus:()=>{if(!S.created)return;S.pending={anlass:'gate_aus'};save();renderOverlay();},
  pBeispiel:()=>beispielwoche(),
  pRunde:()=>{if(!S.created){toast('Erst die Probephase beginnen.');return;}if(S.phase==='probe'){S.phase='1';S.phaseStart=today();if(!S.phase1Start)S.phase1Start=today();}S.runde=S.runde>1?1:2;save();go('auto');toast(S.runde>1?'Erster Durchgang abgeschlossen: Spirale aktiv.':'Zurück im ersten Durchgang.');},
  pWoche:()=>{if(!S.created){toast('Erst die Probephase beginnen.');return;}if(gateAktiv()){toast('Erst das Morgen-Gate abschließen.');return;}wcStart();},
  pReset:()=>{ui.modal={typ:'confirm',titel:'Alles zurücksetzen?',text:'Alle Testdaten, Einstellungen und Wochenchecks werden gelöscht.',ok:'Zurücksetzen'};renderOverlay();},
  panelToggle:()=>{}
};
function rerender(){const a=document.getElementById('app');const top=a?a.scrollTop:0;if(ui.modal){renderOverlay();}else{render();}if(a)a.scrollTop=top;}
const CH={
  pPhase:el=>{S.phase=el.value;S.phaseStart=today();if(el.value!=='probe'&&!S.phase1Start)S.phase1Start=today();if(!S.created)S.created=today();save();go('auto');},
  pAmpel:el=>{if(el.value){setAmpel(el.value,today(),'Test über das Testpanel');save();el.value='';go('auto');}},
  eMorgen:el=>{const v=Number(el.value);if(v>S.settings.morgen){ui.lockern=()=>{S.settings.morgen=v;};ui.modal={typ:'begr',anlass:'gelockert',then:'lockern'};ui.f={};render();}else{S.settings.morgen=v;save();render();}},
  eZeit:el=>{if(el.value){S.settings.stamm.zeit=el.value;save();}},
  eImpulse:el=>{const v=Number(el.value);if(v<S.settings.impulse){ui.lockern=()=>{S.settings.impulse=v;};ui.modal={typ:'begr',anlass:'gelockert',then:'lockern'};ui.f={};render();}else{S.settings.impulse=v;save();render();}},
  eNamen:el=>{S.settings.namen=el.value;save();},
  eBImp:el=>{const v=Number(el.value);const bi=S.begegnung.impuls;if(v<bi.n){ui.lockern=()=>{S.begegnung.impuls.n=v;};ui.modal={typ:'begr',anlass:'gelockert',then:'lockern'};ui.f={};render();}else{bi.n=v;save();render();}},
  eBVon:el=>{S.begegnung.impuls.von=Number(el.value);save();},
  eBBis:el=>{S.begegnung.impuls.bis=Number(el.value);save();},
  eImport:el=>{const file=el.files&&el.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.days!=='object')throw 0;ui.modal={typ:'confirm',titel:'Backup einspielen?',text:'Die aktuellen Testdaten werden durch das Backup ersetzt.',ok:'Einspielen',daten:d};renderOverlay();}catch(e){toast('Die Datei ist kein gültiges Backup.');}};r.readAsText(file);el.value='';}
};
document.addEventListener('click',e=>{ensureAudio();const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.tagName==='INPUT'&&el.type==='checkbox'){fn(el);return;}e.preventDefault();fn(el);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.f){ui.f[el.dataset.f]=el.value;live();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.ch&&CH[el.dataset.ch])CH[el.dataset.ch](el);});
document.getElementById('panelToggle').addEventListener('click',()=>{const p=document.getElementById('panel');const o=p.classList.toggle('open');document.getElementById('panelToggle').setAttribute('aria-expanded',o);document.getElementById('panelToggle').textContent=o?'Schließen':'Test';});
setInterval(tick,200);
setInterval(()=>{renderPanel();if(['heute','gate'].includes(ui.route)&&!ui.modal&&!document.activeElement.matches('textarea,input,select')){const r=autoRoute();if(r!==ui.route&&(r==='gate'||ui.route==='gate'))go('auto');}},15000);
setInterval(renderPanel,1000);
let natPlanAlt='';
function nativePlan(){if(!NATIVE||!S.created)return;const s=S.settings,b=S.begegnung,d=peek(today());const plan={angelegt:true,morgen:s.morgen,stamm:{aktiv:S.phase!=='probe',tage:s.stamm.tage,zeit:s.stamm.zeit},impulse:s.impulse,frage:ANKERFRAGE[S.phase][0],bimp:{n:b.impuls.n,von:b.impuls.von,bis:b.impuls.bis},schwellen:b.schwellen.filter(x=>x.typ==='zeit'&&x.zeit).map(x=>({id:x.id,name:x.name,zeit:x.zeit})),fertig:d&&(d.frei||(d.anker&&d.journal&&d.skala))?today():''};const j=JSON.stringify(plan);if(j!==natPlanAlt){natPlanAlt=j;nat('plan',j);}}
function nativeSync(){if(!NATIVE||!S.created)return;try{const z=JSON.parse(nat('zaehler',today())||'{}');if(z.imp||z.bimp){const d=day();d.impulse.n=Math.max(d.impulse.n||0,z.imp||0);d.bimp.n=Math.max(d.bimp.n||0,z.bimp||0);}if(nat('gateAusGemeldet')===true)S.pending={anlass:'gate_aus'};}catch(e){}save();}
window.punktNativ={
  lage:b=>{S.sim.faceDown=!!b;if(ui.route==='session'&&SES){const x=SES.plan[SES.i];const stt=document.getElementById('s-status');if(stt&&x)stt.innerHTML=sesStatus(x,stepFertig(x));}},
  aktion:a=>{plog('Aktion '+a+' auf '+ui.route);if(!S.created||ui.route==='session')return;if(a==='gate'){if(!GATE_OK.includes(ui.route))go('auto');return;}if(a==='nfc'){A.pNfc();return;}if(a==='impuls'){ui.modal={typ:'impuls'};renderOverlay();return;}if(a==='bimpuls'){ui.modal={typ:'bimpuls'};renderOverlay();return;}if(a&&a.indexOf('schwelle:')===0){if(!gateAktiv()){ui.modal={typ:'swHinweis',id:a.slice(9)};renderOverlay();}return;}if(a==='abend'){go('abend');return;}if(a==='stamm'){go('heute');return;}go('auto');},
  resume:()=>{plog('Zurück in der App · '+ui.route+(SES?' · Schritt '+(SES.i+1):''));nativeSync();if(['heute','gate'].includes(ui.route)&&!ui.modal)go('auto');else render();},
  zurueck:()=>{if(!S.created)return false;const o=document.getElementById('overlay');if(o&&o.innerHTML){const z=o.querySelector('[data-a="modalZu"]');if(z)z.click();return true;}if(ui.route==='session'||gateAktiv())return true;if(ui.route!=='heute'){go('heute');return true;}return false;}
};
try{const g=JSON.parse(localStorage.getItem(SES_KEY)||'null');if(g&&g.s&&S.created&&Date.now()-g.at<20*60000){SES=g.s;SES.last=Date.now();ui.route='session';wach();ui.sesWieder=true;}else localStorage.removeItem(SES_KEY);}catch(e){}
render();
initCaps();
plog('Seite geladen · '+ui.route+(ui.sesWieder?' · Übung fortgesetzt':''));if(ui.sesWieder)toast('Übung fortgesetzt.');
let natLeisteAlt='';
function natLeiste(){try{const e=document.querySelector('#app .scr');let c=e?getComputedStyle(e).backgroundColor:'';if(!c||c==='rgba(0, 0, 0, 0)')c=getComputedStyle(document.body).backgroundColor;if(c!==natLeisteAlt){natLeisteAlt=c;nat('leiste',c);}}catch(e){}}
if(NATIVE){const renderOhne=render;render=function(){renderOhne.apply(this,arguments);natLeiste();};nativeSync();nativePlan();natLeiste();}
</script>
