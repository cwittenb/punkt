<title>Punkt · Übungs-App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#ECECEA; --bg:#FBF9F4; --surface:#F3F3F1; --chip:#EAEAE8; --line:#DADAD7;
  --ink:#262626; --soft:#3A3A3A; --muted:#636362;
  --accent:#5B2A86; --accent-hover:#45206A; --accent-ink:#FBF9F4;
  --pink:#B8175A; --pink-ink:#9E1249; --pink-tint:#EAEAE8; --purple-tint:#EAEAE8; --on-pink:#FBF9F4;
  --good:#2F6B47; --good-tint:#DCE5D3; --warn:#8A5A00; --warn-tint:#EEDFBE; --warn-ink:#6B4600; --crit:#9B2C2C; --crit-tint:#EFD8D0;
  --hard:0 2px 8px rgba(38,38,38,.14),0 1px 2px rgba(38,38,38,.10); --hard-press:0 1px 3px rgba(38,38,38,.16); --scrim:rgba(38,38,38,.45); --shadow:0 18px 50px rgba(38,38,38,.18);
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* Dunkel: System-Einstellung, manuelle Wahl, und die Übungsbildschirme (.night) */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  color-scheme:dark;
  --page:#141414; --bg:#1E1E1E; --surface:#262626; --chip:#2E2E2E; --line:#3A3A3A;
  --ink:#F3F3F1; --soft:#DADAD8; --muted:#A3A3A1;
  --accent:#C7AEF0; --accent-hover:#D8C6F5; --accent-ink:#1E1E1E;
  --pink:#F28DB8; --pink-ink:#F28DB8; --pink-tint:#2E2E2E; --purple-tint:#2E2E2E; --on-pink:#1E1E1E;
  --good:#7FC79A; --good-tint:#1E2B23; --warn:#E8B84A; --warn-tint:#2E2818; --warn-ink:#F0CE7A; --crit:#E58A7F; --crit-tint:#33201E;
  --hard:0 2px 10px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35); --hard-press:0 1px 3px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"],.night{
  color-scheme:dark;
  --page:#141414; --bg:#1E1E1E; --surface:#262626; --chip:#2E2E2E; --line:#3A3A3A;
  --ink:#F3F3F1; --soft:#DADAD8; --muted:#A3A3A1;
  --accent:#C7AEF0; --accent-hover:#D8C6F5; --accent-ink:#1E1E1E;
  --pink:#F28DB8; --pink-ink:#F28DB8; --pink-tint:#2E2E2E; --purple-tint:#2E2E2E; --on-pink:#1E1E1E;
  --good:#7FC79A; --good-tint:#1E2B23; --warn:#E8B84A; --warn-tint:#2E2818; --warn-ink:#F0CE7A; --crit:#E58A7F; --crit-tint:#33201E;
  --hard:0 2px 10px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35); --hard-press:0 1px 3px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.55);
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding-block:24px;min-height:100%}
.phone{position:relative;width:390px;height:844px;flex-shrink:0;border-radius:36px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--bg)}
.app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.panel{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(24px + env(safe-area-inset-top,0px))}
.panel-toggle{display:none}
@media (max-width:820px){
  body{padding-inline:0}
  .stage{padding-block:0;display:block;height:100%}
  .phone{width:100%;height:100%;border-radius:0;border:0;box-shadow:none}
  .panel{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:78%;overflow-y:auto;z-index:50;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--page);border-top:1px solid var(--line);box-shadow:var(--shadow)}
  .panel.open{display:flex}
  .panel-toggle{display:flex;position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);align-items:center;font-weight:700;box-shadow:var(--shadow)}
}

/* Screens */
.scr{min-height:100%;display:flex;flex-direction:column;gap:16px;padding:30px 22px 22px;background:var(--bg);color:var(--ink)}
.scr.tabbed{padding-bottom:0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex-grow:1}
.small{font-size:14px}.xs{font-size:12.5px}
.muted{color:var(--muted)}.soft{color:var(--soft)}
.h1{font-family:var(--display);font-weight:400;font-size:42px;line-height:1.04;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h1s{font-family:var(--display);font-weight:400;font-size:31px;line-height:1.1;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);font-weight:700}
p{margin:0}
.lead{font-size:16px;color:var(--muted);line-height:1.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.hl{border:2px solid var(--pink)}
.card.flat{background:transparent}
.btn{min-height:54px;border-radius:27px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16.5px;padding:0 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;width:100%}
.btn:hover{background:var(--accent-hover)}
.btn:disabled{background:var(--chip);color:var(--muted);cursor:not-allowed}
.btn.sec{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sec:hover{background:var(--purple-tint)}
.btn.small{min-height:44px;font-size:15px;border-radius:22px}
.btn.pink{background:var(--pink);color:var(--on-pink)}
.link{background:none;border:0;color:var(--accent);min-height:44px;padding:0 4px;cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.link.quiet{color:var(--muted)}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btnrow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg{display:grid;gap:6px}
.segb{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer;padding:0 6px}
.segb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.segb.warnon{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--chip);color:var(--soft)}
.chip.pink{background:var(--pink-tint);color:var(--pink-ink)}
.chip.purple{background:var(--purple-tint);color:var(--accent)}
.chip.good{background:var(--good-tint);color:var(--good)}
.chip.warn{background:var(--warn-tint);color:var(--warn-ink)}
.chip.crit{background:var(--crit-tint);color:var(--crit)}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0;background:var(--muted)}
.dot.gruen{background:var(--good)}.dot.gelb{background:var(--warn)}.dot.rot{background:var(--crit)}
.lab{font-weight:700;font-size:15.5px;line-height:1.4}
.feld{display:flex;flex-direction:column;gap:8px}
.labrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ibtn{flex:none;width:36px;height:36px;margin:-7px -8px -7px 0;padding:0;border:0;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ibtn span{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--accent);color:var(--accent);font:italic 700 13px/1 var(--display);display:inline-flex;align-items:center;justify-content:center}
.ibtn[aria-expanded="true"] span{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:14.5px;line-height:1.45;color:var(--soft);background:var(--purple-tint);border-radius:12px;padding:10px 12px;margin:0}
.ta-wrap{position:relative}
textarea,input[type=text],input[type=time],select{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5}
textarea{resize:none;min-height:118px;padding-bottom:56px;display:block}
textarea.short{min-height:90px;padding-bottom:12px}
textarea::placeholder,input::placeholder{color:var(--muted)}
.mic{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:22px;border:1.5px solid var(--pink);background:var(--surface);color:var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mic.on{background:var(--pink);color:var(--on-pink)}
.recpill{position:absolute;right:62px;bottom:20px;padding:2px 10px;border-radius:999px;background:var(--pink-tint);color:var(--pink-ink);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.audio{display:flex;align-items:center;gap:10px;border-radius:22px;background:var(--purple-tint);padding-right:4px}
.audio .play{width:44px;height:44px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:22px;flex-shrink:0}
.info{font-size:13px;color:var(--muted)}
.info.ok{color:var(--good)}
.tabs{position:sticky;bottom:0;margin:auto -22px 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab{min-height:62px;border:0;background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tab.on{color:var(--accent);font-weight:700}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.sday{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mark{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.mark.ok{background:var(--accent);color:var(--accent-ink)}
.mark.heute{background:var(--pink);color:var(--on-pink)}
.mark.n{border:2px dashed var(--warn);color:var(--warn-ink)}
.mark.leer{border:1.5px solid var(--line);color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li button{flex-shrink:0}
.quote{margin:0;padding-left:12px;border-left:2px solid var(--pink);font-family:var(--display);font-size:17px;line-height:1.45}
.pre{white-space:pre-wrap;font-family:var(--body);font-size:13.5px;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-height:260px;overflow-y:auto;margin:0}
.mx{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));gap:4px;align-items:center;font-size:13px}
.mx .c{height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums}
.mx .c.warn{background:var(--pink);border-color:var(--pink);color:var(--on-pink)}
.mx .c.leer{color:var(--muted);font-weight:400}
.mx .h{text-align:center;color:var(--muted)}
.ampel{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;border:1px solid}
.ampel.gruen{background:var(--good-tint);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.ampel.gelb{background:var(--warn-tint);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.ampel.rot{background:var(--crit-tint);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;font-size:15px}
.step .sd{width:12px;height:12px;border-radius:6px;border:2px solid var(--muted);flex-shrink:0}
.step.done{color:var(--muted)}.step.done .sd{background:var(--accent);border-color:var(--accent)}
.step.cur{font-weight:700}.step.cur .sd{background:var(--pink);border-color:var(--pink)}
.timer{font-family:var(--display);font-size:30px;color:var(--pink);font-variant-numeric:tabular-nums}
.pacer-wrap{height:170px;display:flex;align-items:center;justify-content:center}
.ring-wrap{position:relative;width:224px;height:224px;margin:4px auto 0}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:5}
.ring-fg{fill:none;stroke:var(--pink);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring-fg.warm{stroke:var(--accent)}
.ring-wrap.klein{width:132px;height:132px}
.ring-wrap.klein .ring-time{font-size:30px}
.ring-time.warm{color:var(--accent)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-time{font-family:var(--display);font-size:40px;color:var(--pink);font-variant-numeric:tabular-nums}
.ring-sub{font-size:13px;color:var(--muted)}
.pacer{width:160px;height:160px;border-radius:80px;background:var(--pink);opacity:.85;transition:transform 5s ease-in-out}
.pacer-word{text-align:center;font-family:var(--display);font-size:22px;color:var(--pink);min-height:30px}
@media (prefers-reduced-motion: reduce){.pacer{transition:none}}
.status{font-size:15px;color:var(--soft);display:flex;gap:10px;align-items:center}
.modalbg{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--bg);color:var(--ink);border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.full{position:absolute;inset:0;z-index:20}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14.5px;box-shadow:var(--shadow)}
.panel .card{gap:8px}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
.panel h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pb{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px}
.pb:hover{border-color:var(--accent)}
.pb.warnb{color:var(--crit)}
.clock{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.tog{display:flex;align-items:center;gap:10px;min-height:36px;font-size:14px;cursor:pointer}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.daybody{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.daybody h4{margin:6px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dayhead{width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab span{white-space:nowrap}
.vib{display:inline-flex;gap:5px;align-items:center;flex:none}.vib i{display:block;height:8px;border-radius:4px;background:var(--pink)}
.tbl thead td{font-size:12.5px;color:var(--muted);padding-top:0}

/* Formen: eckig, harte Schatten, Panels über die ganze Breite */
.scr .card{margin-inline:-22px;border-radius:0;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 22px}
.scr .card.hl{border-top:2px solid var(--pink)}
.ampel{margin-inline:-22px;border-radius:0;border-width:1px 0;padding:18px 22px}
.btn,.btn.small{border-radius:0;box-shadow:var(--hard)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:var(--hard-press)}
.btn:disabled{box-shadow:none}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--ink) 55%,transparent)}
.btn.sec:hover{background:var(--chip)}
.segb,.chip,.hint,.pre,.mx .c,.sheet,.toast,.pb,.panel .card,.panel-toggle,.recpill,.audio,.audio .play,.icon,.mic,.bar,.bar>span,.ibtn span,textarea,input[type=text],input[type=time],select{border-radius:0}
.segb.on,.segb.warnon{box-shadow:var(--hard)}
.segb{font-size:14px;padding:0 4px;hyphens:auto}
.toast{box-shadow:var(--hard)}
.sheet{border-top:1px solid var(--line)}
.nativ .panel,.nativ .panel-toggle{display:none!important}
.nativ.testmodus .panel-toggle{display:flex!important}
.nativ.testmodus .panel.open{display:flex!important}
.scr .card.ampelbox.gelb{background:var(--warn-tint);border-color:var(--warn)}
.scr .card.ampelbox.rot{background:var(--crit-tint);border-color:var(--crit)}
.logo{font-family:var(--display);font-size:120px;line-height:.6;color:var(--pink);margin:0}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
</style>

<div class="stage">
  <div class="phone" id="phone">
    <div class="app" id="app"></div>
    <div id="overlay"></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <aside class="panel" id="panel" aria-label="Testpanel">
    <div class="card">
      <div class="row between"><h2>Testpanel</h2><span class="chip purple" id="p-store">Browser</span></div>
      <p class="xs muted">Steuert die simulierte Uhrzeit und Sensoren. Gehört nicht zur App.</p>
    </div>
    <div class="card">
      <h3>Simulierte Zeit</h3>
      <div class="clock" id="p-clock">–</div>
      <div class="pbtns">
        <button type="button" class="pb" data-a="tMorgen">Nächster Morgen</button>
        <button type="button" class="pb" data-a="tStunde">+1 Std.</button>
        <button type="button" class="pb" data-a="tStamm">Stammfenster</button>
        <button type="button" class="pb" data-a="tAbend">21:00</button>
        <button type="button" class="pb" data-a="tSonntag">Sonntag 19:00</button>
        <button type="button" class="pb" data-a="tTag">+1 Tag</button>
        <button type="button" class="pb" data-a="tEcht">Echtzeit</button>
      </div>
    </div>
    <div class="card">
      <h3>Sensoren und Tempo</h3>
      <label class="tog"><input type="checkbox" id="p-face" data-a="pFace"> Display liegt unten</label>
      <label class="tog"><input type="checkbox" id="p-demo" data-a="pDemo"> Demo-Tempo: 1 Minute = 5 Sekunden</label>
      <div class="pbtns">
        <button type="button" class="pb" data-a="pNfc">NFC-Aufkleber berühren</button>
        <button type="button" class="pb" data-a="pImpuls">Tagesimpuls auslösen</button>
        <button type="button" class="pb" data-a="pSchwelle">Schwelle auslösen</button>
        <button type="button" class="pb" data-a="pBImpuls">Stiller Impuls</button>
        <button type="button" class="pb" data-a="pGateAus">Gate abgeschaltet</button>
      </div>
    </div>
    <div class="card">
      <h3>Zustand setzen</h3>
      <label class="small muted" for="p-phase">Schwerpunkt</label>
      <select id="p-phase" data-ch="pPhase">
        <option value="probe">Probephase</option><option value="1">Erkennen</option><option value="2">Einheit</option><option value="3">Integration</option>
      </select>

const SIGNAL={depersonalisation:'Depersonalisation',derealisation:'Derealisation',bypassing:'Bypassing',spirituelles_ego:'Spirituelles Ego',zustands_frust:'Zustands-Frust',flucht:'Flucht',uebererregung:'Übererregung'};
const AENDERUNGEN=[
  {id:'kuerzer',art:'Praxis',text:'Hauptpraxis kürzer: 15 statt 20 Minuten'},
  {id:'fenster',art:'Praxis',text:'Anderes Stammfenster wählen'},
  {id:'uebung',art:'Praxis',text:'Anderen Schwerpunkt in der Hauptpraxis setzen'},
  {id:'zurueck',art:'Praxis',text:'Zum vorigen Schwerpunkt wechseln'},
  {id:'morgen',art:'App',text:'Morgenfenster eine Stunde später'},
  {id:'impulse',art:'App',text:'Weniger Tagesimpulse'},
  {id:'erinnerung',art:'App',text:'Erinnerung im Stammfenster 15 Minuten früher'}
];

/* ---------- Begegnung ---------- */
const BKAT=[{k:'fremd',name:'Fremde',lang:'Fremde, wenig steht auf dem Spiel',bsp:'Kasse, Bäcker, Bus'},{k:'arbeit',name:'Kollegen',lang:'Kollegen, Routinegespräche',bsp:'Teamsitzung, Flur, Telefon'},{k:'therapie',name:'Therapie',lang:'Therapiestunden',bsp:'Einzel, Gruppe, Aufnahme'},{k:'freunde',name:'Freunde',lang:'Freunde, Nähe',bsp:'Treffen, Telefonat'},{k:'familie',name:'Familie',lang:'Familie, Kinder, Konflikt',bsp:'Abendessen, Streit, Zubettbringen'}];
const BSTUFE=[
  {titel:'Dort ein Gesicht, hier keins.',text:'Schau den anderen an und bemerke: Dort ist ein Gesicht, hier, wo du schaust, keins. Er erscheint in deinem offenen Raum.'},
  {titel:'Die Stimme als Klang.',text:'Hör die Stimme des anderen wie jeden anderen Klang im Raum. Vor jeder Antwort ein Atemzug.'},
  {titel:'Füße beim Zuhören.',text:'Vor der Stunde der Anker. Während du zuhörst, bleiben 10 % bei den Fußsohlen. Das trägt die gleichschwebende Aufmerksamkeit.'},
  {titel:'Dasselbe schaut aus deinen Augen.',text:'Wenn du jemanden ansiehst: Dasselbe, das hier schaut, schaut dort aus den Augen. Metta läuft still mit.'},
  {titel:'Gerade bin ich jemand.',text:'Wenn du dich zusammenziehst, benenn es leise: „Gerade bin ich jemand.“ Dann Füße, Atem, Raum. Nichts wegmachen.'}];
const BROT={titel:'Nur Füße und Atem.',text:'Solange die Ampel rot ist, keine Frage nach dem Gewahrsein. Spür die Füße, atme aus und schau die Person bewusst an.'};
const BMAX={probe:1,'1':2,'2':4,'3':5};
const BGEW=['nie','kurz','zeitweise','meist'];
const BKON={naeher:'näher',gleich:'wie sonst',ferner:'ferner'};
const BAUS=['Inhalt','Wie ich wirke','Kritik','Konflikt','Nähe','Zeitdruck','Müdigkeit','anderes'];
const BGRUND=[['Zurückkehren zählt, nicht Dauer.','Der Moment „ich war weg“ ist schon Gewahrsein.'],['10 % reichen.','Ein kleiner Teil bleibt bei Füßen oder Atem, der Rest gehört dem Gespräch.'],['Der Kontakt wird dichter, nicht dünner.','Wirkt jemand wie hinter Glas, ist das ein Warnzeichen, kein Fortschritt.']];
function bMax(){return S.runde>1?5:(BMAX[S.phase]||1);}
function bStufe(){return Math.max(1,Math.min(S.begegnung.stufe||1,bMax()));}
function fokusFeld(T){T=T||today();const s=bStufe();if(s<=1||S.runde<=1)return s;const ab=S.begegnung.stufeAb;if(ab&&ab>=addDays(weekStart(T),-7))return s;const idx=Math.floor(diffDays('2026-01-05',weekStart(T))/7);return ((idx%s)+s)%s+1;}
function bFokus(T){return BKAT[fokusFeld(T)-1];}
function letzteNotiz(kat,vor){const L=bIn(addDays(vor,-180),addDays(vor,-1)).filter(b=>b.kat===kat&&b.text);return L.length?L[L.length-1]:null;}
function bKat(s){return BKAT[(s||bStufe())-1];}
function bKatName(k){return (BKAT.find(c=>c.k===k)||{name:k}).name;}
function bUebung(){return ampelAm().stufe==='rot'?BROT:BSTUFE[fokusFeld()-1];}
function kreisNamen(s){return BKAT.slice(0,s||bStufe()).map(c=>c.name).join(' · ');}
function kreisSvg(s){const R=[16,28,40,52,64];let g='';for(let i=4;i>=0;i--){const an=i<s;g+='<circle cx="70" cy="70" r="'+R[i]+'" style="fill:'+(an?'var(--purple-tint)':'none')+';stroke:'+(an?'var(--accent)':'var(--line)')+';stroke-width:1.5'+(an?'':';stroke-dasharray:3 4')+'"/>';}return '<svg viewBox="0 0 140 140" width="120" height="120" role="img" aria-label="Kreis: '+s+' von 5 Feldern">'+g+'</svg>';}
function stufePhase(s){return ['probe','1','2','3'].find(p=>BMAX[p]>=s);}
function bIn(from,to){const out=[];for(const k of range(from,to)){const d=peek(k);if(d&&d.begeg)d.begeg.forEach(b=>out.push(Object.assign({tag:k},b)));}return out;}
function bFern(T){return bIn(addDays(T,-6),T).filter(b=>b.kon==='ferner').length;}
function bRueck(n){return n>=3?'3+':String(n);}
function swInfo(s){if(!s)return '';return s.typ==='zeit'?s.zeit+' Uhr · Mo–Fr':s.typ==='nfc'?'NFC · '+(s.ort||'Aufkleber'):'Ort · '+(s.ort||'Ankunft');}
function schwellePlan(){const rot=ampelAm().stufe==='rot';const u=bUebung();return[{key:'sa',titel:'Ein Atemzug',text:'Einatmen. Lang ausatmen.',pacer:true,sek:10},{key:'sb',titel:rot?'Die Füße':'Wer schaut gerade?',text:rot?'Gewicht, Boden, Kontakt. Mehr braucht es heute nicht.':'Nicht antworten. Dann, im Gespräch: '+u.titel,blick:true,sek:10},{key:'sc',titel:'10 % bleiben hier',text:'Fußsohlen spüren. Dieser kleine Teil bleibt im Körper, der Rest gehört dem Gespräch.',blick:true,sek:10}];}
function faelligeSchwelle(){const n=now();if(dow(keyOf(n))>4)return null;const jetzt=n.getHours()*60+n.getMinutes();const d=peek(today());return S.begegnung.schwellen.find(s=>{if(s.typ!=='zeit'||!s.zeit)return false;const [h,m]=s.zeit.split(':').map(Number);const t=h*60+m;return jetzt>=t-20&&jetzt<=t+5&&!(d&&d.schwellen.some(x=>x.id===s.id));})||null;}

/* ---------- Phase, Ampel, Pläne ---------- */
function phaseInfo(){const p=S.phase;const start=S.phaseStart||today();const d=Math.max(0,diffDays(start,today()));return{p:p,def:PHASEN[p],tag:d+1,woche:Math.floor(d/7)+1};}
function phaseLabel(){return phaseInfo().def.name;}
function seitTagen(n){return n===1?'1 Tag':n+' Tagen';}
function leereMin(){if(S.phase==='probe'||!S.phase1Start)return 1;const w=Math.floor(Math.max(0,diffDays(S.phase1Start,today()))/7)+1;return Math.min(10,w);}
const STUFE={gruen:0,gelb:1,rot:2};
const STUFE_NAME={gruen:'Grün',gelb:'Gelb',rot:'Rot'};
function ampelAm(k){k=k||today();let cur={stufe:'gruen',grund:'',ab:null};for(const a of S.ampel)if(a.ab<=k)cur=a;return cur;}
function setAmpel(stufe,ab,grund){S.ampel.push({stufe:stufe,ab:ab,grund:grund});S.ampel.sort((a,b)=>a.ab<b.ab?-1:a.ab>b.ab?1:0);}
function erhoeheAmpel(stufe,grund){const m=addDays(today(),1);const cur=ampelAm(m);if(STUFE[stufe]>STUFE[cur.stufe]){setAmpel(stufe,m,grund);return true;}return false;}
function passungInfo(){const ks=Object.keys(S.checks).sort();if(!ks.length)return null;const c=S.checks[ks[ks.length-1]];return{p:c.passung,datum:c.datum};}
function letzterCheck(){const ks=Object.keys(S.checks).sort();return ks.length?S.checks[ks[ks.length-1]]:null;}
function passungStatus(){const c=letzterCheck();const lauf=S.aenderungen.filter(a=>a.wirkung==='offen').slice(-1)[0];const laeuft=lauf?{label:'Änderung läuft: '+lauf.text,cls:'purple'}:null;
  if(!c||c.passung==='passt')return laeuft||{label:'Passung: passt',cls:'purple'};
  if(c.besprochen)return laeuft||{label:'Passung: besprochen',cls:'purple'};
  if(c.antwort==='besprechen')return{label:'Passung: besprechen · Wochencheck '+fmtShort(c.datum),cls:'pink',action:'besprechen',offen:true};
  if(c.aenderung||laeuft)return laeuft||{label:'Änderung: '+c.aenderung,cls:'purple'};
  if(c.antwort==='weiter')return{label:'Passung: geprüft, weiter so',cls:'purple'};
  return{label:'Passung: prüfen · Wochencheck '+fmtShort(c.datum),cls:'pink',action:'besprechen',offen:true};}
function passungChipS(st){return st.action?'<button type="button" class="chip '+st.cls+'" data-a="'+st.action+'" style="border:0;cursor:pointer">'+esc(st.label)+'</button>':'<span class="chip '+st.cls+'">'+esc(st.label)+'</span>';}
function passungHeute(){const st=passungStatus();return st.offen?passungChipS(st):'';}
function passungAktuell(){const ks=Object.keys(S.checks).sort();return ks.length?S.checks[ks[ks.length-1]].passung:'passt';}
function ankerPlan(){const a=ampelAm().stufe;if(a==='rot')return[st('kohaerenz',2),st('erdung',8)];if(a==='gelb')return[st('kohaerenz',3),st('koerperErdend',7)];return[st('kohaerenz',2),st('koerperKurz',4),st('leere',1)];}
function hauptPlan(){const a=ampelAm().stufe;const L=leereMin();const kurz=S.settings.hauptKurz;
  if(a==='rot')return[st('kohaerenz',3),st('erdung',12)];
  if(a==='gelb')return[st('kohaerenz',3),st('koerperErdend',7)];
  if(S.phase==='2')return[st('kohaerenz',2),st('sinne',kurz?8:12),st('leere',L)];
  if(S.phase==='3')return[st('kohaerenz',2),st('frei',kurz?8:12),st('leere',L)];
  return[st('kohaerenz',3),st('koerper',kurz?7:10),st('leere',S.phase==='probe'?1:L)];}
function hauptTitel(){return{probe:'Hauptpraxis: Kohärenz, Körper, Leere','1':'Hauptpraxis: Kohärenz, Körper, Leere','2':'Hauptpraxis: Sinnes-Erkundung','3':'Hauptpraxis nach Wahl'}[S.phase];}
function uebungPlan(id){switch(id){
  case 'haupt':return hauptPlan();
  case 'harding':return[st('harding',10)];
  case 'metta':return[st('kohaerenz',2),st('metta',8)];
  case 'wuenschen':return[st('kohaerenz',2),st('wuenschen',13)];
  case 'leere':return[st('leere',5)];
  case 'erdung':return[st('kohaerenz',2),st('erdung',8)];
  case 'gehen':return[st('sinne',15)];
  case 'klang':return[st('klang',5)];
  case 'ankergehen':return[st('ankerGehen',5)];
  case 'breathwork':return[st('bwVor',2),st('bwAtmen',30),st('bwRuhe',10),st('bwNach',3)];
  default:return[st('kohaerenz',5)];}}
function sessionsIn(from,to,typ){let n=0;for(const k of range(from,to)){const d=peek(k);if(d)n+=d.haupt.filter(h=>h.typ===typ).length;}return n;}
function empfehlungen(t,ort){
  const a=ampelAm().stufe,T=today(),ws=weekStart(T),ms=T.slice(0,8)+'01',h=now().getHours();
  const hauptHeute=sessionsIn(T,T,'haupt'),hauptWoche=sessionsIn(ws,T,'haupt');const out=[];
  for(const k of KATALOG){
    if(!k.phasen.includes(S.phase)||!k.orte.includes(ort)||k.min>t)continue;
    if(a!=='gruen'){if(!['kohaerenz','erdung','klang'].includes(k.id))continue;}else if(k.nurWarn)continue;
    if(k.vor18&&h>=18)continue;
    let grund='';
    if(k.rhythmus==='woche'){if(sessionsIn(ws,T,k.id)>=1)continue;grund='Diese Woche noch offen.';}
    if(k.rhythmus==='woche2'){const n=sessionsIn(ws,T,k.id);if(n>=2)continue;grund='Diese Woche '+n+' von 2 Mal.';}
    if(k.rhythmus==='monat'){if(sessionsIn(ms,T,k.id)>=1)continue;grund='Diesen Monat noch offen.';}
    if(k.id==='haupt'){if(hauptHeute>0)continue;grund='Heute noch keine Hauptpraxis. Diese Woche '+hauptWoche+' von 3–5.';}
    if(k.id==='schatten')grund='Diese Woche noch offen. Sie braucht 25 Minuten allein, und die hast du gerade.';
    if(k.id==='breathwork')grund='Einmal im Monat möglich: Ampel grün, vor 18 Uhr, diesen Monat noch offen.';
    if(!grund)grund=GRUND[k.id]||'';
    out.push(Object.assign({},k,{grund:grund,titel:k.id==='haupt'?hauptTitel():k.titel,dauer:k.id==='haupt'?'15–25 Min.':k.id==='klang'?'5–10 Min.':k.min+' Min.'}));
  }
  out.sort((x,y)=>x.prio-y.prio);
  if(!out.length)out.push(Object.assign({},KATALOG[KATALOG.length-1],{grund:GRUND.kohaerenz,dauer:'5 Min.'}));
  return out;
}

/* ---------- UI-Zustand ---------- */
const ui={route:'auto',f:{},info:{},modal:null,wc:null,ki:null,nach:null,zeit:{t:30,ort:'allein'},offen:{},schatten:null,angst:null,panelOpen:false,lastPacer:false};
let SES=null,REC=null;
const GATE_OK=['gate','session','journal','skala','notausgang','frei','start','bnotiz'];
function gateAktiv(){if(!S.created)return false;const n=now();if(n.getHours()<S.settings.morgen)return false;const d=peek(today());return !(d&&d.frei);}
function autoRoute(){if(!S.created)return 'start';if(gateAktiv()){const d=peek(today());if(!d||!d.anker)return 'gate';if(!d.journal)return 'journal';if(!d.skala)return 'skala';}return 'heute';}
function go(r,keep){if(REC){if(NATIVE)nat('aufnahmeStopp');REC=null;}if(r==='auto')r=autoRoute();if(gateAktiv()&&!GATE_OK.includes(r))r=autoRoute();ui.route=r;if(!keep)ui.f={};render();const a=document.getElementById('app');if(a)a.scrollTop=0;}
function fragen(){return FRAGEN[S.phase];}
function minAudio(){return S.settings.demo?5:15;}
function secPerMin(){return S.settings.demo?5:60;}

/* ---------- Audio ---------- */
let ACTX=null;
function ensureAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!ACTX&&C)ACTX=new C();if(ACTX&&ACTX.state==='suspended')ACTX.resume();}catch(e){}}
function ton(f1,f2,dauer,vol){if(!ACTX)return;try{const t=ACTX.currentTime,o=ACTX.createOscillator(),g=ACTX.createGain();o.type='sine';o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+dauer);o.connect(g);g.connect(ACTX.destination);o.start(t);o.stop(t+dauer+.1);}catch(e){}}
function gong(){ton(392,392,2.6,.18);setTimeout(()=>ton(588,588,2.2,.07),40);}
function sprich(w){if(NATIVE&&nat('sprich',w))return;try{const u=new SpeechSynthesisUtterance(w);u.lang='de-DE';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function atemSignal(w){const m=S.settings.begleitung;if(m==='ton')ton(w==='ein'?396:528,w==='ein'?528:396,1.4,.15);else if(m==='stimme')sprich(w);}
const ATEM={epoch:0,idx:-1};
function pacerTick(){const el=document.getElementById('pacer');if(!el){ui.lastPacer=false;return;}
  if(!ui.lastPacer){ui.lastPacer=true;ATEM.epoch=Date.now();ATEM.idx=-1;}
  const idx=Math.floor((Date.now()-ATEM.epoch)/5000);const cur=ui.route==='session'&&SES&&SES.warm<=0?SES.plan[SES.i]:null;if(cur&&cur.pacer&&SES.atemAus)return;if(idx===ATEM.idx)return;
  if(cur&&cur.pacer&&idx>0&&idx%2===0&&SES.elapsed>=stepDur(cur)-1.5){ATEM.idx=idx;SES.elapsed=stepDur(cur);SES.atemAus=true;el.style.transform='scale(.55)';const we=document.getElementById('pacer-word');if(we)we.textContent='';stufeEnde();return;}
  ATEM.idx=idx;const w=idx%2===0?'ein':'aus';
  el.style.transform=w==='ein'?'scale(1)':'scale(.55)';const wd=document.getElementById('pacer-word');if(wd)wd.textContent=w;atemSignal(w);}
function schlaf(){if(NATIVE)nat('wach',false);if(WAKE){try{WAKE.release();}catch(e){}WAKE=null;}}
let WAKE=null;function wach(){if(NATIVE)nat('wach',true);try{if(navigator.wakeLock&&!WAKE)navigator.wakeLock.request('screen').then(l=>{WAKE=l;l.addEventListener('release',()=>{WAKE=null;});}).catch(()=>{});}catch(e){}}

/* ---------- Sessions ---------- */
const SES_KEY='punkt-ses';
function sesMerken(){try{if(SES)localStorage.setItem(SES_KEY,JSON.stringify({s:SES,at:Date.now()}));else localStorage.removeItem(SES_KEY);}catch(e){}ui.sesGemerkt=Date.now();}
function plog(t){if(typeof NATIVE!=='undefined'&&NATIVE)nat('log',String(t));}
function warmDauer(x,erster){const w=String(x.text||'').split(/\s+/).filter(Boolean).length;return Math.min(20,Math.max(erster?10:5,Math.ceil(w/3)+(erster?5:3)));}
function startSession(typ,ctx,extra){ensureAudio();const plan=typ==='anker'?ankerPlan():typ==='schwelle'?schwellePlan():uebungPlan(typ);SES=Object.assign({typ:typ,ctx:ctx,plan:plan,i:0,elapsed:0,last:Date.now(),warm:0,warmEl:0},extra||{});if(typ!=='schwelle')SES.warm=warmDauer(plan[0],true);wach();go('session');sesMerken();plog('Übung gestartet: '+typ);}
function stepDur(s){return s.sek!=null?s.sek:s.min*secPerMin();}
function stepFertig(x){return SES.elapsed>=stepDur(x)&&(!x.pacer||!!SES.atemAus);}
function stufeEnde(){if(SES.typ==='schwelle'){if(SES.i<SES.plan.length-1)ton(528,528,.9,.08);else gong();sesWeiter();return;}gong();render();}
function brauchtLage(s){if(SES&&SES.typ==='schwelle')return false;if(s.offen||s.gehen)return false;if(s.pacer)return S.settings.begleitung!=='stumm';return true;}
function stepLaeuft(s){return !brauchtLage(s)||!!S.sim.faceDown;}
function sesMinuten(){let m=0;SES.plan.forEach((x,i)=>{if(i<SES.i)m+=x.min;else if(i===SES.i)m+=Math.min(x.min,SES.elapsed/secPerMin());});return Math.round(m*10)/10;}
function sesWeiter(){const s=SES;if(!s)return;if(s.i<s.plan.length-1){s.i++;s.elapsed=0;s.atemAus=false;s.warm=s.typ==='schwelle'?0:warmDauer(s.plan[s.i],false);s.warmEl=0;s.last=Date.now();render();sesMerken();plog('Schritt '+(s.i+1)+' von '+s.plan.length+': '+s.plan[s.i].titel);}else sesFertig();}
function sesFertig(){const s=SES;const at=hm(now());schlaf();try{localStorage.removeItem(SES_KEY);}catch(e){}plog('Übung fertig: '+s.typ);
  if(s.typ==='schwelle'){SES=null;day().schwellen.push({id:s.schwelleId||null,name:s.titel||'',at:at});save();go('begegnung');toast('Geh hinein. 10 % bleiben bei den Füßen.');return;}
  const min=sesMinuten();SES=null;
  if(s.typ==='anker'){day().anker={min:min,variante:ampelAm().stufe,at:at};save();go('journal');return;}
  ui.nach={typ:s.typ,min:min,at:at,ort:s.ctx==='zeit'?ui.zeit.ort:(s.ctx==='stamm'?'arbeit':null),empfohlen:s.ctx==='zeit'&&ui.zeit.top===s.typ};save();go('nach');}
function tick(){
  const t=Date.now();
  if(SES){const dt=(t-SES.last)/1000;SES.last=t;
    if(ui.route==='session'&&SES.warm>0){SES.warmEl+=dt;const rest=SES.warm-SES.warmEl;if(rest<=0){SES.warm=0;SES.warmEl=0;ton(440,528,1.2,.12);render();return;}const wz=document.getElementById('s-zeit');if(wz)wz.textContent=String(Math.ceil(rest));const wr=document.getElementById('s-ring');if(wr)wr.setAttribute('stroke-dashoffset',(100-100*Math.min(1,SES.warmEl/SES.warm)).toFixed(2));return;}
    if(ui.route==='session'){const s=SES.plan[SES.i];const dur=stepDur(s);
      if(SES.elapsed<dur&&stepLaeuft(s)){SES.elapsed=Math.min(dur,SES.elapsed+dt);if(SES.elapsed>=dur&&!s.pacer){stufeEnde();return;}}
      const z=document.getElementById('s-zeit');if(z)z.textContent=mmss(dur-SES.elapsed);const rg=document.getElementById('s-ring');if(rg)rg.setAttribute('stroke-dashoffset',(100-100*Math.min(1,SES.elapsed/dur)).toFixed(2));
      const stt=document.getElementById('s-status');if(stt)stt.innerHTML=sesStatus(s,stepFertig(s));}}
  if(SES&&t-(ui.sesGemerkt||0)>3000)sesMerken();
  if(REC){const p=document.querySelector('[data-rec-pill="'+REC.key+'"]');if(p)p.textContent='● '+mss((t-REC.start)/1000);live();}
  pacerTick();
}
function sesStatus(s,fertig){if(fertig)return '<span class="dot gruen"></span>Gong. Weiter, wenn du bereit bist.';
  if(s.pacer&&SES&&SES.elapsed>=stepDur(s))return 'Noch dieser Atemzug, dann der Gong.';
  if(!brauchtLage(s))return s.pacer?'Folge dem Kreis.':s.gehen?'Im Gehen darf das Handy in die Tasche.':'Das Display darf oben liegen.';
  return S.sim.faceDown?'<span class="dot" style="background:var(--pink)"></span>Läuft · Display liegt unten'+(s.pacer?' · '+(S.settings.begleitung==='ton'?'der Ton':'die Stimme')+' führt':''):'<span class="dot gelb"></span>Pausiert. Leg das Handy mit dem Display nach unten.';}
</script>
<script>
'use strict';
/* ---------- Bausteine ---------- */
const INFO={
  'Was fand ich, als ich nach dem Beobachter suchte?':'Beschreib, was du tatsächlich gefunden hast, nicht was du darüber weißt. Oft ist es kein Ding, nur Raum, Empfindung oder Klang. Auch „nichts Greifbares“ ist ein Fund. Beispiel: „Ich suchte hinter den Augen und fand nur Helligkeit und leichten Druck, keinen, der schaut.“',
  'War eben etwas da, das keinen Sonderzustand brauchte?':'Sonderzustand heißt: Weite, Stille, Glück, Energie, alles, was kommt und geht. Gemeint ist das schlichte Bemerken, das auch da ist, wenn du müde oder unruhig bist. „Eben“ meint den Anker oder den Moment davor. Beispiel: „Beim Zähneputzen. Nichts Besonderes, und genau das.“ Auch „Nein, ich habe nach Weite gesucht“ ist eine ehrliche Antwort.',
  'Wo suchte ich eine Grenze und fand keine?':'Such in der Erfahrung, nicht im Denken: Wo hört das Hören auf und fängt der Klang an? Wo endet die Hand? Beschreib die Stelle, an der du gesucht hast, und was dort war. Beispiel: „Beim Vogelgesang fand ich keinen Ort, an dem das Hören aufhört.“',
  'Was war gestern in einer Begegnung zu Hause anders?':'Ein Moment mit der Familie, der sich anders anfühlte als sonst: mehr Raum, weniger Abwehr, oder auch das Gegenteil. Beschreib die Situation in einem Satz, ohne sie zu bewerten.',
  'Wann kam gestern Angst, und was geschah mit ihr?':'Ein konkreter Moment: die Situation und wo im Körper. Dann: Blieb sie, verging sie, hat sie dein Handeln bestimmt? Beispiel: „Vor der Teamsitzung, Enge in der Brust. Beim Hinspüren wurde sie weicher, ging aber nicht weg.“',
  'Wo habe ich Scheitern riskiert, und wem ist es geschehen?':'Etwas Ungeübtes vor anderen, oder ein Fehler, den du zugegeben hast, ohne ihn zu erklären. Der zweite Teil fragt: Findest du jemanden, dem es geschehen ist, oder nur Gefühle und Gedanken? Kein Risiko gestern ist auch eine Antwort.',
  'Was hast du riskiert, und wem ist es geschehen?':'Etwas Ungeübtes vor anderen, oder ein Fehler, den du zugegeben hast, ohne ihn zu erklären. Dann: Findest du jemanden, dem es geschehen ist, oder nur Gefühle und Gedanken?',
  'Wie deutlich spürst du deinen Körper?':'0 heißt kaum oder wie taub, 4 heißt deutlich, von innen. Gemeint ist dieser Moment, nicht der ganze Tag.',
  'Wie wirklich wirkt die Welt gerade?':'0 heißt fremd, wie hinter Glas oder im Film, 4 ganz gewöhnlich wirklich. Weite oder Stille machen die Welt nicht unwirklicher; Unwirklichkeit mit Unbehagen ist das Warnsignal.',
  'Sind Gefühle spürbar, auch unangenehme?':'0 heißt taub oder flach, 4 lebendig, auch Ärger oder Traurigkeit. Ruhe ist kein niedriger Wert, Taubheit schon.',
  'Wie hast du geschlafen?':'Die letzte Nacht, so wie du sie einschätzt. Schlechter Schlaf ist oft ein früher Hinweis auf Übererregung.',
  'Wie stark ist die innere Unruhe?':'Gemessen wird die Stärke, nicht das Bemerken. Den Druck deutlich zu bemerken ist gut. 3 oder 4 heißt deutliche Unruhe, Getriebenheit oder Druck; das wird rosa markiert und zählt für die Ampel erst, wenn es an 3 von 7 Tagen vorkommt. Leichte Nervosität vor einem vollen Tag ist 1 oder 2.',
  'Wie gut konntest du dich im Alltag konzentrieren?':'Die ganze Woche im Blick: Konntest du bei der Arbeit und zu Hause bei einer Sache bleiben? 0 kaum, 4 gut.',
  'Wie sehr hast du dich von Menschen zurückgezogen?':'Gemeint ist Rückzug, der sich nach Abstand oder Gleichgültigkeit anfühlt, nicht gewählte Zeit für dich.',
  'Wie oft hast du unangenehme Gefühle mit spirituellen Gedanken beiseitegeschoben?':'Zum Beispiel Ärger sofort mit „ist ja nur ein Gedanke“ weglegen, statt ihn zu spüren. Ab 3 geht die Ampel auf Gelb.',
  'Wie oft hast du dich anderen innerlich überlegen gefühlt?':'Das Gefühl, weiter zu sein als andere oder über ihren Sorgen zu stehen. Ab 3 geht die Ampel auf Gelb. Ehrlich hilft hier mehr als gut aussehen.',
  'Wie groß war der Frust über ausbleibende Zustände?':'Enttäuschung, weil Weite oder Stille nicht wiederkommen. Das ist häufig und kein Fehler, aber ein Zeichen, dass die Aufmerksamkeit nach Zuständen greift.',
  'Wie halten deine Zeitfenster?':'Es zählt, ob die Fenster tatsächlich stattfanden, nicht wie gut die Praxis darin war.',
  'Wenn du nach dem Beobachter suchst: Was ist meist da?':'„Offenes, gewöhnliches Gewahrsein“ heißt: Beim Hinschauen ist meist sofort etwas Schlichtes da, ohne dass es sich besonders anfühlen muss. Suchen oder Anstrengung ist genauso normal.',
  'Wenn du nach der Grenze zwischen dir und der Welt suchst, auch im Gespräch: Was findest du meist?':'Gemeint ist die Erfahrung beim Hinschauen, nicht die Überzeugung. „Eine deutliche Grenze“ ist kein Mangel, nur ein Hinweis, dass Einheit noch Zeit braucht.',
  'Wenn Angst oder Scheitern kommen: Was ist meist da?':'„Mitreißen“ heißt: Angst oder Scheitern bestimmen, was du denkst und tust, ohne dass Raum darum herum bleibt. Keine Antwort ist besser als eine andere.',
  'Mit wem?':'Die Art der Begegnung. Vorausgewählt ist das Feld, das gerade im Mittelpunkt steht.',
  'Wie gewahr warst du?':'Grob über die ganze Begegnung geschätzt: „kurz“ ein Moment, „zeitweise“ mehrmals, „meist“ fast durchgehend. Dafür gibt es kein Ziel.',
  'Wie oft bist du zurückgekehrt?':'Jedes Mal, wenn du bemerkt hast: Ich war weg, im Inhalt oder in meiner Wirkung. Das ist die eigentliche Übung. Auch jetzt, beim Notieren, kehrst du zurück.',
  'Der Kontakt war …':'Verglichen mit ähnlichen Begegnungen ohne Übung. „Ferner“ heißt: wie hinter Glas, abgeschnitten, unbeteiligt. Das ist ein Hinweis, kein Fortschritt.',
  'Was hat dich herausgezogen?':'Was dich aus dem Gewahrsein geholt hat. „Inhalt“: das Thema selbst. „Wie ich wirke“: die Sorge um deinen Eindruck.',
  'Zwei Sätze: Was hast du gefunden?':'Was du tatsächlich bemerkt hast, nicht was hätte sein sollen. Auch Langeweile oder Unruhe sind ein Fund.',
  'Was fandst du dort, wo andere dein Gesicht sehen?':'Die Erfahrung beim Zeigen, nicht das Wissen: Farbe, Raum, das Zimmer? Oder doch ein Gesicht?',
  'Wer wünschte hier wem?':'Schau beim Wünschen hin: Findest du einen, der wünscht, getrennt von dem, dem er wünscht?',
  'Was blieb, als der Zustand ging?':'Breathwork erzeugt starke Zustände. Die Frage richtet den Blick auf das, was schon vorher da war und danach noch da ist.',
  'Wer wollte das? Und was blieb ohne es?':'Stell dir kurz vor, es kommt nie. Was bleibt dann noch da?',
  'Wer will gerade ausweichen?':'Kein Rechtfertigen, nur Hinschauen: Was in dir will gerade nicht üben? Müdigkeit, Widerstand, ein voller Tag? Ein Satz reicht.',
  'Ein Satz, mindestens 20 Zeichen':'Ein ehrlicher Satz reicht. Einzelne Sätze bleiben im Wochencheck unkommentiert; erst eine Häufung wird angesprochen.',
  'Mit wem, und was kam heraus?':'Ein Satz reicht, zum Beispiel: „Mit der Supervisorin: Dienstags liegt die Teamsitzung, das Fenster passt dort nicht.“ Auch „Waren nur Testdaten“ ist eine Antwort.',
  'Wie oft hast du dich diese Woche wie neben dir gefühlt, abgetrennt von dir selbst, und das war unangenehm?':'Gemeint ist ein Abstand zu dir selbst, der sich taub, mechanisch oder beunruhigend anfühlt, als wärst du nicht richtig da. Das gelassene Zuschauen aus der Übung zählt nicht. Summe beider Fragen ab 3: Gelb, ab 5: Rot.',
  'Wie oft wirkte die Welt diese Woche fern, flach oder wie hinter Glas, und das war unangenehm?':'Gemeint ist eine Welt, die unwirklich oder wie ein Film wirkt und dich damit allein lässt. Klarheit oder Weite beim Hinschauen zählen nicht. Summe beider Fragen ab 3: Gelb, ab 5: Rot.',
  'Was ist gerade da?':'Was auch immer gerade erscheint: ein Gefühl, ein Gedanke, ein Bemerken. Ohne Anspruch.'
};
function ibtn(key){return '<button type="button" class="ibtn" data-a="info" data-v="'+key+'" aria-expanded="'+!!ui.info[key]+'" aria-controls="i-'+key+'" aria-label="Erklärung zur Frage"><span aria-hidden="true">i</span></button>';}
function hintP(key,text){return text&&ui.info[key]?'<p class="hint" id="i-'+key+'">'+esc(text)+'</p>':'';}
function qlab(key,text,id,extra){const info=INFO[text];return '<div class="labrow"><p class="lab"'+(id?' id="'+id+'"':'')+'>'+esc(text)+(extra||'')+'</p>'+(info?ibtn(key):'')+'</div>'+hintP(key,info);}
function recEnde(){if(!REC)return;let sek=Math.round((Date.now()-REC.start)/1000);if(NATIVE){const n=nat('aufnahmeStopp');if(typeof n==='number'&&n>0)sek=n;}ui.f['aud_'+REC.key]=(ui.f['aud_'+REC.key]||0)+sek;REC=null;}
function stopRec(){recEnde();}
function audSek(key){return (ui.f['aud_'+key]||0)+(REC&&REC.key===key?(Date.now()-REC.start)/1000:0);}

function tabs(akt){const t=[['heute','Heute',ICON.home],['begegnung','Begegnung',ICON.people],['tagebuch','Journal',ICON.book],['check','Check',ICON.pulse],['einst','Optionen',ICON.gear]];
  return '<nav class="tabs" aria-label="Hauptnavigation">'+t.map(x=>'<button type="button" class="tab '+(akt===x[0]?'on':'')+'" data-a="go" data-v="'+x[0]+'" '+(akt===x[0]?'aria-current="page"':'')+'>'+x[2]+'<span>'+x[1]+'</span></button>').join('')+'</nav>';}
function feld(key,label,min,opt){opt=opt||{};const v=ui.f[key]||'';const aud=ui.f['aud_'+key]||0;const rec=REC&&REC.key===key;const mic=opt.mic!==false;
  const infoText=opt.info||INFO[label];const info=infoText?ibtn(key):'';
  return '<div class="feld"><div class="labrow"><label for="f-'+key+'" class="lab">'+esc(label)+'</label>'+info+'</div>'+hintP(key,infoText)+'<div class="ta-wrap"><textarea id="f-'+key+'" class="'+(mic?'':'short')+'" data-f="'+key+'" data-min="'+(min||0)+'" data-mic="'+(mic?1:0)+'" placeholder="'+esc(opt.ph||(mic?'Schreib, oder tippe aufs Mikrofon …':'Ein ehrlicher Satz …'))+'">'+esc(v)+'</textarea>'+
  (mic?(rec?'<span class="recpill" data-rec-pill="'+key+'">● 0:00</span>':'')+'<button type="button" class="mic '+(rec?'on':'')+'" data-a="mic" data-v="'+key+'" aria-label="'+(rec?'Aufnahme stoppen':'Antwort sprechen')+'">'+(rec?ICON.stop:ICON.mic)+'</button>':'')+'</div>'+
  (aud>0?'<div class="audio"><span class="play">'+ICON.play+'</span><div class="col grow" style="gap:0"><strong class="small">Sprachnotiz '+mss(aud)+'</strong><span class="xs muted">'+(NATIVE?'auf dem Handy gespeichert':'simuliert, der Browser gibt kein Mikrofon frei')+'</span></div><button type="button" class="icon" data-a="audioWeg" data-v="'+key+'" aria-label="Sprachnotiz löschen">'+ICON.x+'</button></div>':'')+
  '<span class="info" data-info="'+key+'"></span></div>';}
function fieldOk(key){const el=document.querySelector('[data-f="'+key+'"]');const min=el?Number(el.dataset.min||0):0;const t=(ui.f[key]||'').trim().length;const aud=audSek(key);const mic=el?el.dataset.mic==='1':false;return t>=min||(mic&&min>0&&aud>=minAudio());}
function live(){
  document.querySelectorAll('[data-info]').forEach(el=>{const k=el.dataset.info;const inp=document.querySelector('[data-f="'+k+'"]');const min=Number(inp?inp.dataset.min:0);const mic=inp&&inp.dataset.mic==='1';if(!min){el.textContent='';return;}
    const t=(ui.f[k]||'').trim().length,aud=audSek(k);
    if(mic&&aud>=minAudio()){el.textContent='Sprachnotiz zählt · genug';el.className='info ok';}
    else if(t>=min){el.textContent=t+' Zeichen · genug';el.className='info ok';}
    else{el.textContent=t+' von '+min+' Zeichen'+(mic?', oder '+minAudio()+' Sek. sprechen':'');el.className='info';}});
  document.querySelectorAll('[data-why]').forEach(el=>{const keys=el.dataset.why.split(',');const miss=[];keys.forEach((k,i)=>{if(fieldOk(k))return;const inp=document.querySelector('[data-f="'+k+'"]');const min=Number(inp?inp.dataset.min:0);const t=(ui.f[k]||'').trim().length;miss.push('Frage '+(i+1)+' braucht noch '+Math.max(1,min-t)+' Zeichen');});el.textContent=miss.length?'Noch offen: '+miss.join(', ')+' (oder je '+minAudio()+' Sek. sprechen).':'';});
  document.querySelectorAll('[data-ready]').forEach(b=>{const keys=b.dataset.ready.split(',').filter(Boolean);const extra=b.dataset.extra?!!ui.f[b.dataset.extra]:true;b.disabled=!(keys.every(fieldOk)&&extra);});
}
function seg(key,werte,labels,cols,warnFn){const cur=ui.f[key];return '<div class="seg" role="group" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+werte.map((w,i)=>{const on=cur===w;const warn=on&&warnFn&&warnFn(w);return '<button type="button" class="segb '+(warn?'warnon':on?'on':'')+'" aria-pressed="'+on+'" data-a="set" data-k="'+key+'" data-v="'+esc(JSON.stringify(w))+'">'+esc(labels?labels[i]:w)+'</button>';}).join('')+'</div>';}
function stichChips(key,liste,cols){liste=liste||STICHWORTE;return '<div class="seg" role="group" aria-label="Stichwort" style="grid-template-columns:repeat('+(cols||3)+',minmax(0,1fr))">'+liste.map(w=>{const on=ui.f[key]===w;return '<button type="button" class="segb '+(on?'on':'')+'" aria-pressed="'+on+'" data-a="stich" data-k="'+key+'" data-v="'+esc(w)+'">'+esc(w)+'</button>';}).join('')+'</div>';}
function ampelChip(s){return '<span class="chip '+(s==='gruen'?'good':s==='gelb'?'warn':'crit')+'"><span class="dot '+s+'"></span>Ampel '+STUFE_NAME[s].toLowerCase()+'</span>';}
function passungChip(p){const m={passt:['purple','Passung: passt'],pruefen:['pink','Passung: prüfen'],aendern:['pink','Passung: ändern']}[p]||['purple','Passung: passt'];return '<span class="chip '+m[0]+'">'+m[1]+'</span>';}
function ringHtml(inner,anteil,warm){return '<div class="ring-wrap'+(warm?' klein':'')+'"><svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="94" class="ring-bg"/><circle cx="100" cy="100" r="94" class="ring-fg'+(warm?' warm':'')+'" id="s-ring" pathLength="100" stroke-dasharray="100" stroke-dashoffset="'+(100-100*Math.min(1,anteil||0)).toFixed(2)+'"/></svg><div class="ring-in">'+inner+'</div></div>';}
function warmHinweis(x){if(x.gehen)return 'Lies in Ruhe, dann steck das Handy ein. Die Zeit läuft nach dem Ton.';if(!brauchtLage(x))return x.pacer?'Setz dich zurecht, der Kreis führt den Atem. Mit Ton oder Stimme kannst du das Handy weglegen.':'Lies in Ruhe. Die Übung beginnt nach dem Ton.';if(x.pacer)return 'Leg das Handy mit dem Display nach unten. '+(S.settings.begleitung==='ton'?'Der Ton':'Die Stimme')+' führt den Atem, die Zeit läuft nach dem Ton.';return 'Lies in Ruhe, dann leg das Handy mit dem Display nach unten. Die Zeit läuft nach dem Ton.';}
function begleitSeg(){const b=S.settings.begleitung;return '<div class="seg" role="group" aria-label="Atembegleitung" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+[['stumm','Stumm'],['ton','Ton'],['stimme','Stimme']].map(x=>'<button type="button" class="segb '+(b===x[0]?'on':'')+'" aria-pressed="'+(b===x[0])+'" data-a="begleitung" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';}
function pacerHtml(anteil){const b=S.settings.begleitung;const kreis='<div class="pacer" id="pacer" aria-hidden="true" style="transform:scale(.55)"></div>';return (anteil!=null?ringHtml(kreis,anteil):'<div class="pacer-wrap">'+kreis+'</div>')+'<p class="pacer-word" id="pacer-word" aria-hidden="true"></p><div class="seg" role="group" aria-label="Atembegleitung" style="grid-template-columns:repeat(3,minmax(0,1fr))">'+[['stumm','Stumm'],['ton','Ton'],['stimme','Stimme']].map(x=>'<button type="button" class="segb '+(b===x[0]?'on':'')+'" aria-pressed="'+(b===x[0])+'" data-a="begleitung" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';}

const V={};
V.start=()=>'<div class="scr"><p class="logo" role="img" aria-label="Punkt">.</p>'+(NATIVE?'':'<span class="eyebrow">Testversion</span>')+'<h1 class="h1">Willkommen.</h1><p class="lead">'+(NATIVE?'Morgen-Gate, Praxis, Journal, Tagesskala, Wochencheck. Die App meldet sich zu deinen Zeiten. Sonst ist sie still.':'Diese Version führt dich durch den ganzen Weg: Morgen-Gate, Praxis, Journal, Tagesskala, Wochencheck und KI-Auswertung. Uhrzeit, Sensoren und Schwerpunkte steuerst du im Testpanel.')+'</p>'+
  '<div class="card"><strong>Die Probephase dauert zwei Wochen.</strong><p class="soft">Jeden Tag der Morgenanker ab '+S.settings.morgen+' Uhr. Dazu mindestens fünfmal 15 Minuten Hauptpraxis in wechselnden Zeitfenstern. So findest du dein Stammfenster.</p></div>'+
  '<div class="card"><strong>Was gespeichert wird</strong><p class="soft small">'+(NATIVE?'Alles bleibt auf diesem Handy: Journal, Aufnahmen, Einstellungen. Exportieren kannst du in den Optionen.':'Deine Testdaten bleiben in diesem Artefakt und sind nur für dich sichtbar. Sprachaufnahmen werden nur simuliert, weil der Browser hier kein Mikrofon freigibt.')+'</p></div>'+
  '<div class="grow"></div><button type="button" class="btn" data-a="beginnen">Probephase heute beginnen</button>'+(NATIVE&&!S.settings.testmodus?'':'<button type="button" class="btn sec" data-a="pBeispiel">Mit Beispieldaten starten</button>')+'</div>';

V.gate=()=>{const a=ampelAm();const plan=ankerPlan();const total=plan.reduce((s,x)=>s+x.min,0);const haupt=plan[1]||plan[0];const d=peek(today());
  let ampelBox='';
  if(a.stufe==='gruen')ampelBox='<div class="row small"><span class="dot gruen"></span><span><strong>Ampel grün</strong> · Plan läuft wie vorgesehen</span></div>';
  else ampelBox='<div class="card ampelbox '+a.stufe+'"><div class="row"><span class="dot '+a.stufe+'"></span><strong>Ampel '+STUFE_NAME[a.stufe].toLowerCase()+'</strong></div><p class="soft small">'+esc(a.grund)+(a.stufe==='rot'?'. Selbstergründung pausiert. Sprich diese Woche mit deinem Lehrer oder einer Kollegin.':'. Heute die erdende Variante.')+'</p></div>';
  return '<div class="scr night"><div class="row between small muted"><span>'+fmtDay(today())+'</span><span>'+esc(phaseLabel())+'</span></div>'+
  '<div class="col"><h1 class="h1">Erst die Praxis.</h1><p class="lead">Das Handy wird frei, sobald Praxis, Journal und Tagesskala erledigt sind.</p></div>'+ampelBox+
  '<section class="card grow" aria-label="Übung heute"><span class="eyebrow">Heute</span><h2 class="h2">'+(a.stufe==='rot'?'Erdungsübung':a.stufe==='gelb'?'Morgenanker, erdend':'Morgenanker')+'</h2><div class="row wrap"><span class="chip">'+total+' Min.</span><span class="chip">'+plan.map(x=>x.titel).join(' · ')+'</span></div><p class="soft">'+esc(haupt.text)+'</p>'+
  (d&&d.anker?'<p class="small" style="color:var(--pink)">Anker erledigt. Noch offen: '+(!d.journal?'Journal':'Tagesskala')+'.</p>':'')+'</section>'+
  (d&&d.anker?'<button type="button" class="btn" data-a="go" data-v="'+(!d.journal?'journal':'skala')+'">Weiter zum '+(!d.journal?'Journal':'Tagesskala')+'</button>':'<button type="button" class="btn" data-a="ankerStart">Praxis beginnen</button><p class="small muted" style="text-align:center">Oder den NFC-Aufkleber am Kissen berühren.</p>')+
  '<div class="row between"><button type="button" class="link quiet" data-a="telefon" style="text-decoration:none;display:flex;gap:8px;align-items:center">'+ICON.phone+'Telefon</button><button type="button" class="link quiet" data-a="go" data-v="notausgang">Notausgang</button></div></div>';};

V.session=()=>{const s=SES;if(!s)return V.heute();const x=s.plan[s.i];const dur=stepDur(x);const fertig=stepFertig(x);const letzter=s.i===s.plan.length-1;
  const titel=s.titel?s.titel:s.typ==='anker'?'Morgenanker':uebName(s.typ);
  return '<div class="scr night"><div class="row between"><button type="button" class="link quiet" data-a="sesAbbruch">Abbrechen</button><span class="small muted">'+esc(titel)+' · '+esc(PHASEN[S.phase].kurz)+'</span></div>'+
  '<ol class="steps" aria-label="Ablauf">'+s.plan.map((y,k)=>'<li class="step '+(k<s.i?'done':k===s.i?'cur':'')+'" '+(k===s.i?'aria-current="step"':'')+'><span class="sd"></span><span class="grow">'+esc(y.titel)+'</span><span class="muted" style="font-weight:400">'+(y.sek!=null?y.sek+' Sek.':y.min+' Min.')+'</span></li>').join('')+'</ol>'+
  (s.warm>0?'<section class="card grow" aria-live="polite"><span class="eyebrow">'+(s.i===0?'Ankommen':'Kurz umstellen')+' · gleich</span><h1 class="h2">'+esc(x.titel)+'</h1><p class="soft" style="font-size:17px">'+esc(x.text)+'</p><p class="small" style="color:var(--accent)">'+warmHinweis(x)+'</p>'+(x.pacer?begleitSeg():'')+ringHtml('<span class="ring-time warm" id="s-zeit">'+Math.ceil(s.warm-s.warmEl)+'</span><span class="ring-sub">Sekunden</span>',s.warmEl/s.warm,true)+'<button type="button" class="link quiet" data-a="warmSkip" style="align-self:center">Überspringen</button></section><button type="button" class="btn" disabled>'+(letzter?'Abschließen':'Weiter')+'</button></div>':
  '<section class="card grow"><div class="row between" style="align-items:baseline"><h1 class="h2">'+esc(x.titel)+'</h1>'+(x.pacer?'<span class="timer" id="s-zeit" role="timer" aria-label="verbleibend">'+mmss(dur-s.elapsed)+'</span>':'')+'</div><p class="soft">'+esc(x.text)+'</p>'+(x.pacer?pacerHtml(s.elapsed/dur):ringHtml('<span class="ring-time" id="s-zeit" role="timer" aria-label="verbleibend">'+mmss(dur-s.elapsed)+'</span><span class="ring-sub">von '+(x.sek!=null?x.sek+' Sek.':x.min+' Min.')+'</span>',s.elapsed/dur))+(S.settings.demo&&x.sek==null?'<p class="xs muted" style="text-align:center">Demo-Tempo: 1 Minute dauert hier 5 Sekunden.</p>':'')+'<p class="status" id="s-status">'+sesStatus(x,fertig)+'</p>'+
  (x.leere&&!fertig?'<button type="button" class="btn sec small" data-a="leereGenug">Genug für heute. Zählt als geschafft.</button>':'')+'</section>'+
  '<button type="button" class="btn" data-a="sesWeiter" '+(fertig?'':'disabled')+'>'+(letzter?'Abschließen':'Weiter')+'</button></div>');};

V.journal=()=>{const f=fragen();const d=day();if(d.journal&&!ui.f._init){ui.f.a=d.journal.a;ui.f.b=d.journal.b;ui.f.aud_a=d.journal.aud_a;ui.f.aud_b=d.journal.aud_b;}ui.f._init=1;
  return '<div class="scr"><div class="row between small muted"><span>Morgen-Journal</span><span>'+fmtDay(today())+'</span></div><h1 class="h1s">Was hast du gefunden?</h1>'+(()=>{const lb=letzterBesuch();return lb?'<section class="card"><span class="eyebrow">Beim letzten Mal in '+esc(PHASEN[S.phase].name)+'</span><span class="xs muted">'+fmtShort(lb.tag)+'</span><blockquote class="quote" style="font-size:15px">„'+esc(lb.text)+'“</blockquote><p class="xs muted">Dieselbe Frage, ein anderer Tag. Was ist heute anders?</p></section>':'';})()+feld('a',f[0],20)+feld('b',f[1],20)+'<div class="grow"></div><button type="button" class="btn" data-a="journalOk" data-ready="a,b">Weiter zur Tagesskala</button><p class="xs muted" data-why="a,b" aria-live="polite" style="text-align:center"></p></div>';};

V.skala=()=>{const d=day();if(d.skala&&!ui.f._init){ITEMS.forEach(i=>{ui.f['sk_'+i.k]=d.skala[i.k];});}ui.f._init=1;const alle=ITEMS.every(i=>ui.f['sk_'+i.k]!=null);
  return '<div class="scr"><div class="col" style="gap:6px"><div class="row between small muted"><span>Tagesskala</span><span>'+fmtDay(today())+'</span></div><h1 class="h1s">Wie geht es dir gerade?</h1><p class="small muted">Fünf kurze Fragen. Rosa markierte Werte zählen für die Ampel, aber erst, wenn sie an mehreren Tagen vorkommen.</p></div>'+
  ITEMS.map(i=>{const v=ui.f['sk_'+i.k];const w=istWarn(i.k,v);return '<div class="col" style="gap:6px">'+qlab('sk_'+i.k,i.frage,'l-'+i.k)+seg('sk_'+i.k,[0,1,2,3,4],null,5,val=>istWarn(i.k,val))+'<div class="row between xs muted"><span>'+i.lo+'</span>'+'<span>'+i.hi+'</span></div></div>';}).join('')+
  '<button type="button" class="btn" data-a="skalaOk" '+(alle?'':'disabled')+'>Freigeben</button></div>';};

V.heute=()=>{const T=today(),d=peek(T),n=now(),a=ampelAm(),pi=phaseInfo();const vor=n.getHours()<S.settings.morgen&&!(d&&d.frei);
  let h1,sub;
  if(vor){h1='Guten Morgen.';sub='Das Morgenfenster beginnt um '+S.settings.morgen+' Uhr.';}
  else if(d&&d.notausgang){h1='Heute ausgelassen.';sub='Frei bis morgen, '+S.settings.morgen+' Uhr. Dein Satz geht in den Wochencheck ein.';}
  else{h1='Frei für heute.';sub=[d&&d.anker?'Anker geübt':null,d&&d.journal?'Journal geschrieben':null,d&&d.skala?'Skala ausgefüllt':null].filter(Boolean).join(' · ');}
  const cards=[];
  const sw=!vor&&S.created?faelligeSchwelle():null;
  if(sw)cards.push('<section class="card hl"><span class="chip pink" style="align-self:flex-start">Schwelle '+esc(sw.zeit)+'</span><h2 class="h2">'+esc(sw.name)+'</h2><p class="small muted">30 Sekunden, bevor es losgeht.</p><button type="button" class="btn small" data-a="swAnker" data-v="'+esc(sw.id)+'">Anker</button></section>');
  // Stammfenster
  const st=S.settings.stamm;const [sh,sm]=st.zeit.split(':').map(Number);const sMin=sh*60+sm;const jetzt=n.getHours()*60+n.getMinutes();
  const stammTag=st.tage.includes(dow(T));const hauptHeute=d?d.haupt.filter(h=>h.typ==='haupt').length:0;
  if(S.phase!=='probe'&&stammTag&&!hauptHeute&&!(d&&d.stammSkip)&&!vor){
    if(jetzt>=sMin-30&&jetzt<=sMin+120)cards.push('<section class="card hl"><span class="chip pink" style="align-self:flex-start">Stammfenster '+st.zeit+'</span><h2 class="h2">Zeit für die Hauptpraxis.</h2><div class="btnrow"><button type="button" class="btn small" data-a="uebung" data-v="haupt" data-ctx="stamm">Starten</button><button type="button" class="btn sec small" data-a="stammSkip">Heute nicht</button></div></section>');
    else if(jetzt>sMin+120)cards.push('<section class="card"><strong>Das Stammfenster um '+st.zeit+' ist vorbei.</strong><p class="small muted">Heute noch keine Hauptpraxis.</p><div class="btnrow"><button type="button" class="btn small" data-a="uebung" data-v="haupt" data-ctx="stamm">Jetzt nachholen</button><button type="button" class="btn sec small" data-a="stammSkip">Begründen</button></div></section>');
  }
  if(n.getHours()>=21&&!(d&&d.abend)&&!vor)cards.push('<section class="card hl"><span class="chip pink" style="align-self:flex-start">21:00</span><h2 class="h2">Abend-Rückschau</h2><p class="small muted">Zwei Fragen, zwei Minuten.</p><button type="button" class="btn small" data-a="go" data-v="abend">Jetzt</button></section>');
  if(dow(T)===6&&n.getHours()>=17&&!S.checks[weekStart(T)])cards.push('<section class="card hl"><span class="chip pink" style="align-self:flex-start">Sonntag</span><h2 class="h2">Wochencheck</h2><p class="small muted">Etwa fünf Minuten. Danach steht die Ampel für die nächste Woche.</p><button type="button" class="btn small" data-a="wcStart">Starten</button></section>');
  // Wochenstreifen
  const tage=range(addDays(T,-6),T);
  const strip='<div class="strip">'+tage.map(k=>{const x=peek(k);const heute=k===T;let cls='leer',inh='';let lab=WT_LANG[dow(k)]+': ';
    if(x&&x.notausgang){cls='n';inh='N';lab+='Notausgang';}else if(x&&x.anker){cls=heute?'heute':'ok';inh=ICON.check;lab+='absolviert';}else{inh=heute?'':'–';lab+=heute?'offen':'nicht absolviert';}
    return '<div class="sday"><span style="'+(heute?'font-weight:700;color:var(--ink)':'')+'">'+WT[dow(k)]+'</span><span class="mark '+cls+'" role="img" aria-label="'+esc(lab)+'">'+inh+'</span></div>';}).join('')+'</div>';
  const absolv=tage.filter(k=>{const x=peek(k);return x&&x.anker;}).length;const notaus=tage.filter(k=>{const x=peek(k);return x&&x.notausgang;}).length;
  // Phase
  const min=pi.def.min?pi.def.min*7:null;const hw=sessionsIn(weekStart(T),T,'haupt');
  const aufgaben=wochenAufgaben(T);
  return '<div class="scr tabbed"><div class="row between small muted"><span>'+fmtDay(T)+' · '+hm(n)+'</span><span>'+esc(phaseLabel())+'</span></div>'+
  '<div class="col" style="gap:8px"><h1 class="h1">'+h1+'</h1><p class="small muted">'+esc(sub)+'</p><div class="row wrap">'+ampelChip(a.stufe)+passungHeute()+'</div></div>'+
  (vor&&!d?'':'')+cards.join('')+
  '<section class="card" aria-labelledby="h-tage"><h2 id="h-tage" class="lab">Letzte 7 Tage</h2>'+strip+'<p class="xs muted">'+absolv+' von 7 absolviert'+(notaus?' · N = Notausgang':'')+'</p></section>'+
  '<section class="card" aria-labelledby="h-ph"><div class="row between" style="align-items:baseline"><h2 id="h-ph" class="lab">'+(S.phase==='probe'?'Probephase':'Schwerpunkt: '+esc(pi.def.name))+'</h2><span class="xs muted">seit '+seitTagen(pi.tag)+'</span></div>'+
  '<p class="small">'+(S.phase==='probe'?'Hauptpraxis in der Probephase bisher: '+sessionsIn(S.phaseStart||T,T,'haupt')+' von 5.':'Hauptpraxis diese Woche: '+hw+' von 3–5 · Leere heute '+leereMin()+' Min.')+'</p></section>'+
  (!vor?'<section class="card" aria-labelledby="h-bg"><div class="row between" style="align-items:baseline"><h2 id="h-bg" class="lab">Begegnung · '+esc(bFokus().name)+'</h2><span class="xs muted">heute '+(d?d.begeg.length:0)+' notiert</span></div><p class="small">'+esc(bUebung().titel)+'</p><div class="btnrow"><button type="button" class="btn sec small" data-a="bnotiz">Notiz</button><button type="button" class="btn sec small" data-a="go" data-v="begegnung">Mehr</button></div></section>':'')+
  (aufgaben.length?'<section class="card" aria-labelledby="h-auf"><h2 id="h-auf" class="lab">Diese Woche</h2><div class="list">'+aufgaben.join('')+'</div></section>':'')+
  '<div class="btnrow"><button type="button" class="btn small" data-a="go" data-v="zeit">Ich habe Zeit</button><button type="button" class="btn sec small" data-a="notiz">'+ICON.pen+'Schnellnotiz</button></div>'+
  (S.phase==='3'?'<button type="button" class="btn sec small" data-a="angstStart">Angst-Protokoll</button>':'')+
  tabs('heute')+'</div>';};

V.begegnung=()=>{const T=today(),s=bStufe(),k=bFokus(T),u=bUebung(),ln=letzteNotiz(k.k,weekStart(T)),a=ampelAm().stufe,d=peek(T);const heute=d?d.begeg.length:0;
  const w=bIn(addDays(T,-6),T);const fern=w.filter(b=>b.kon==='ferner').length;
  const aus={};w.forEach(b=>{if(b.aus)aus[b.aus]=(aus[b.aus]||0)+1;});const top=Object.keys(aus).sort((x,y)=>aus[y]-aus[x])[0];
  const proKat=BKAT.map(c=>{const x=w.filter(b=>b.kat===c.k);return{c:c,n:x.length,gut:x.filter(b=>b.gew>=2).length,rueck:x.reduce((z,b)=>z+(b.rueck||0),0)};}).filter(x=>x.n);
  const erledigt=id=>d&&d.schwellen.some(x=>x.id===id);const bim=S.begegnung.impuls;
  return '<div class="scr tabbed"><div class="row between small muted"><span>'+fmtDay(T)+'</span><span>'+esc(phaseLabel())+'</span></div>'+
  '<h1 class="h1s">Begegnung</h1>'+
  '<section class="card hl"><span class="eyebrow">Dein Kreis: '+esc(kreisNamen(s))+'</span>'+(S.runde>1&&s>1?'<span class="chip pink" style="align-self:flex-start">Feld der Woche: '+esc(k.name)+'</span>':'')+'<h2 class="h2">'+esc(u.titel)+'</h2><p class="soft">'+esc(u.text)+'</p><p class="xs muted">Übung für '+esc(k.lang)+', zum Beispiel '+esc(k.bsp)+'.'+(s>1?' In den anderen Feldern gelten ihre Übungen weiter.':'')+' Wähl 1–3 Begegnungen am Tag bewusst aus.</p>'+(ln?'<p class="xs muted">Zuletzt in diesem Feld, '+fmtShort(ln.tag)+':</p><blockquote class="quote" style="font-size:15px">„'+esc(ln.text)+'“</blockquote>':'')+
   (a==='gelb'?'<p class="xs">Ampel gelb: Der Kreis bleibt, wie er ist, bis die Ampel wieder grün ist.</p>':'')+
   '<div class="row wrap"><span class="chip '+(heute?'purple':'')+'">Heute '+heute+' notiert</span>'+(fern?'<span class="chip pink">Kontakt ferner: '+fern+'× in 7 Tagen</span>':'')+'</div>'+
   '<div class="btnrow"><button type="button" class="btn small" data-a="bnotiz">Notiz</button><button type="button" class="btn sec small" data-a="swAnker" data-v="">Anker</button></div></section>'+
  '<section class="card"><h2 class="lab">Grundsätze</h2><div class="list">'+BGRUND.map(g=>'<div class="li" style="align-items:flex-start;padding-block:8px"><span class="small"><strong>'+esc(g[0])+'</strong><br><span class="soft">'+esc(g[1])+'</span></span></div>').join('')+'</div></section>'+
  '<section class="card"><div class="row between"><h2 class="lab">Schwellen</h2><button type="button" class="link" data-a="swNeu" style="min-height:36px">Hinzufügen</button></div><p class="xs muted">Vor festen Übergängen erinnert dich die App an einen 30-Sekunden-Anker. Eine Einladung, keine Pflicht.</p>'+
   (S.begegnung.schwellen.length?'<div class="list">'+S.begegnung.schwellen.map(x=>'<div class="li"><span class="small"><strong>'+esc(x.name)+'</strong><br><span class="muted">'+esc(swInfo(x))+'</span></span><span class="row">'+(erledigt(x.id)?'<span class="chip good">heute</span>':'<button type="button" class="btn sec small" style="width:auto;min-height:36px" data-a="swAnker" data-v="'+esc(x.id)+'">Anker</button>')+'<button type="button" class="icon" data-a="swWeg" data-v="'+esc(x.id)+'" aria-label="'+esc(x.name)+' entfernen">'+ICON.x+'</button></span></div>').join('')+'</div>':'<p class="small muted">Noch keine Schwellen.</p>')+'</section>'+
  '<section class="card"><h2 class="lab">Stiller Impuls</h2>'+(bim.n?'<div class="row" style="align-items:flex-start"><span class="vib" aria-hidden="true" style="margin-top:6px"><i style="width:10px"></i><i style="width:10px"></i><i style="width:26px"></i></span><span class="small">'+bim.n+'× am Tag, '+bim.von+' bis '+bim.bis+' Uhr. Nur Vibration: kurz, kurz, lang.</span></div><p class="xs muted">Die Vibration heißt: Wer schaut gerade? Du musst nicht aufs Handy schauen.'+(d&&d.bimp&&d.bimp.n?' Heute '+d.bimp.b+' von '+d.bimp.n+' bemerkt.':'')+'</p>':'<p class="small muted">Aus. In den Optionen einschalten.</p>')+'</section>'+
  '<section class="card"><h2 class="lab">Letzte 7 Tage</h2>'+(proKat.length?'<table class="tbl"><thead><tr><td>Mit wem</td><td>Notizen</td><td>zeitweise+</td><td>zurück</td></tr></thead><tbody>'+proKat.map(x=>'<tr><td>'+esc(x.c.name)+'</td><td>'+x.n+'</td><td>'+x.gut+'</td><td>'+x.rueck+'×</td></tr>').join('')+'</tbody></table>'+(top&&aus[top]>=2?'<p class="small">Hat dich am häufigsten herausgezogen: <strong>'+esc(top)+'</strong> ('+aus[top]+'×)</p>':''):'<p class="small muted">Noch keine Notizen.</p>')+'</section>'+
  '<section class="card"><h2 class="lab">Kreis</h2><div class="row" style="justify-content:center">'+kreisSvg(s)+'</div><p class="xs muted" style="text-align:center">innen Fremde, außen Familie</p><div class="list">'+BKAT.map((c,i)=>{const n=i+1;const zu=n>bMax();const st=n<=s?'<span class="chip purple">im Kreis</span>':zu?'<span class="xs muted" style="white-space:nowrap">mit '+esc(PHASEN[stufePhase(n)].name)+'</span>':'<span class="xs muted" style="white-space:nowrap">kann dazukommen</span>';return '<div class="li"><span class="small"><strong>'+esc(c.name)+'</strong><br><span class="muted">'+esc(BSTUFE[i].titel)+'</span></span>'+st+'</div>';}).join('')+'</div><p class="xs muted">Ein Feld kommt im Wochencheck dazu, wenn du im äußersten Feld mindestens 4 Begegnungen in 14 Tagen notiert hast, der Kontakt höchstens einmal ferner war und die Ampel grün ist. Wie gewahr du warst, zählt dafür nicht. Der Kreis wird größer, nicht höher.</p></section>'+
  tabs('begegnung')+'</div>';};

V.bnotiz=()=>{if(!ui.f._init){ui.f.bKat=bFokus().k;ui.f._init=1;}const f=ui.f;const bereit=f.bKat&&f.bGew!=null&&f.bRueck!=null&&f.bKon;
  return '<div class="scr"><div class="row between"><button type="button" class="link" data-a="go" data-v="'+(ui.bnZurueck||'begegnung')+'">Zurück</button><span class="small muted">Notiz nach Begegnung · '+hm(now())+'</span></div><h1 class="h1s">Wie war der Kontakt?</h1>'+
  '<div class="col" style="gap:6px">'+qlab('bKat','Mit wem?')+''+seg('bKat',BKAT.map(c=>c.k),BKAT.map(c=>c.name),3)+'</div>'+
  '<div class="col" style="gap:6px">'+qlab('bGew','Wie gewahr warst du?')+''+seg('bGew',[0,1,2,3],BGEW,4)+'</div>'+
  '<div class="col" style="gap:6px">'+qlab('bRueck','Wie oft bist du zurückgekehrt?')+''+seg('bRueck',[0,1,2,3],['0','1','2','3+'],4)+'<p class="xs muted">Jedes Bemerken, dass du weg warst, zählt.</p></div>'+
  '<div class="col" style="gap:6px">'+qlab('bKon','Der Kontakt war …')+''+seg('bKon',['naeher','gleich','ferner'],['näher','wie sonst','ferner'],3,v=>v==='ferner')+'</div>'+
  (f.bKon==='ferner'?'<div class="card" style="border-color:var(--pink)"><p class="small">Ferner ist ein Hinweis, kein Fortschritt. Spür jetzt die Füße, atme aus und schau die nächste Person bewusst an. Dreimal in einer Woche stellt die Ampel auf Gelb.</p></div>':'')+
  '<div class="col" style="gap:6px">'+qlab('bAus','Was hat dich herausgezogen?',null,' <span class="muted" style="font-weight:400">· optional</span>')+''+stichChips('bAus',BAUS,2)+'</div>'+
  feld('bt','Ein Satz, wenn du magst',0)+
  '<button type="button" class="btn" data-a="bnotizOk" '+(bereit?'':'disabled')+'>Speichern</button></div>';};

function wochenAufgaben(T){const ws=weekStart(T),ms=T.slice(0,8)+'01',out=[];const n=id=>sessionsIn(ws,T,id);
  const zeile=(titel,status,btn)=>'<div class="li"><span>'+titel+'</span><span class="row">'+status+(btn||'')+'</span></div>';
  const erl='<span class="chip good">erledigt</span>';
  const start=id=>'<button type="button" class="btn sec small" style="width:auto;min-height:36px" data-a="uebung" data-v="'+id+'">Starten</button>';
  if(S.phase==='1')out.push(zeile('Harding-Experiment',n('harding')?erl:'',n('harding')?'':start('harding')));
  if(S.phase==='2')out.push(zeile('Metta mit Wendung',n('metta')>=2?erl:'<span class="xs muted">'+n('metta')+' von 2</span>',n('metta')>=2?'':start('metta')));
  if(S.phase==='3'){out.push(zeile('Schattenarbeit',n('schatten')?erl:'',n('schatten')?'':'<button type="button" class="btn sec small" style="width:auto;min-height:36px" data-a="schattenStart">Starten</button>'));
    out.push(zeile('Scheitern riskieren',n('scheitern')?erl:'',n('scheitern')?'':'<button type="button" class="btn sec small" style="width:auto;min-height:36px" data-a="scheitern">Eintragen</button>'));
    const wm=sessionsIn(ms,T,'wuenschen');out.push(zeile('Wünschen ohne zu brauchen <span class="xs muted">monatlich</span>',wm?erl:'',wm?'':start('wuenschen')));}
  if(S.phase!=='probe'){const nb=bIn(addDays(T,-6),T).length;out.push(zeile('Begegnungen notiert <span class="xs muted">7 Tage</span>',nb>=3?erl:'<span class="xs muted">'+nb+' von 3</span>',nb>=3?'':'<button type="button" class="btn sec small" style="width:auto;min-height:36px" data-a="bnotiz">Notiz</button>'));}
  return out;}

V.zeit=()=>{const z=ui.zeit;const list=empfehlungen(z.t,z.ort);const top=list[0];z.top=top.id;const alt=list.slice(1,3);
  const chip=(k,w,lab)=>'<button type="button" class="segb '+(z[k]===w?'on':'')+'" aria-pressed="'+(z[k]===w)+'" data-a="zeitSet" data-k="'+k+'" data-v="'+w+'">'+lab+'</button>';
  return '<div class="scr"><div class="row between"><button type="button" class="link" data-a="go" data-v="heute">Zurück</button><span class="small muted">'+hm(now())+' · '+esc(PHASEN[S.phase].kurz)+'</span></div>'+
  '<div class="col" style="gap:6px"><h1 class="h1s">Du hast Zeit.</h1><p class="small muted">Wie viel, und wo bist du?</p></div>'+
  '<div class="col" style="gap:8px"><p class="lab" id="l-z">Zeit</p><div class="seg" role="group" aria-labelledby="l-z" style="grid-template-columns:repeat(4,minmax(0,1fr))">'+[5,15,30,60].map(m=>chip('t',m,m+' Min.')).join('')+'</div></div>'+
  '<div class="col" style="gap:8px"><p class="lab" id="l-o">Ort</p><div class="seg" role="group" aria-labelledby="l-o" style="grid-template-columns:repeat(2,minmax(0,1fr))">'+ORTE.map(o=>chip('ort',o,ORT_NAME[o])).join('')+'</div></div>'+
  '<section class="card hl" aria-label="Empfehlung"><span class="chip pink" style="align-self:flex-start">Nächster Schritt</span><h2 class="h2">'+esc(top.titel)+'</h2><span class="small muted">'+esc(top.dauer)+'</span><p>'+esc(top.grund)+'</p><button type="button" class="btn small" data-a="empfStart" data-v="'+top.id+'">Starten</button></section>'+
  (alt.length?'<div class="col" style="gap:0"><p class="lab">Oder</p><div class="list">'+alt.map(x=>'<div class="li"><span>'+esc(x.titel)+' <span class="xs muted">'+esc(x.dauer)+'</span></span><button type="button" class="btn sec small" style="width:auto;min-height:36px" data-a="empfStart" data-v="'+x.id+'">Starten</button></div>').join('')+'</div></div>':'')+
  (ampelAm().stufe!=='gruen'?'<p class="xs muted">Die Ampel steht auf '+STUFE_NAME[ampelAm().stufe]+'. Deshalb schlägt die App nur Kohärenz und Erdung vor.</p>':'')+'</div>';};

V.nach=()=>{const n=ui.nach;if(!n)return V.heute();const probe=S.phase==='probe'&&n.typ==='haupt';
  const fr={haupt:'Zwei Sätze: Was hast du gefunden?',breathwork:'Was blieb, als der Zustand ging?',harding:'Was fandst du dort, wo andere dein Gesicht sehen?',metta:'Wer wünschte hier wem?',wuenschen:'Wer wollte das? Und was blieb ohne es?'}[n.typ]||'Eine Zeile, wenn du magst.';
  if(!ui.f._init){ui.f.ort=n.ort;ui.f._init=1;}
