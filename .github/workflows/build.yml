name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Signaturschlüssel entschlüsseln
        env:
          PUNKT_SIGNING: ${{ secrets.PUNKT_SIGNING }}
        run: |
          if [ -z "$PUNKT_SIGNING" ]; then
            echo "::error::Das Secret PUNKT_SIGNING fehlt. Anlegen unter Settings → Secrets and variables → Actions."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/punkt.jks.enc -out signing/punkt.jks -pass env:PUNKT_SIGNING

      - name: APK bauen
        env:
          PUNKT_SIGNING: ${{ secrets.PUNKT_SIGNING }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -3
          cp app/build/outputs/apk/release/app-release.apk punkt-0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: punkt-apk
          path: punkt-*.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: ". 0.${{ github.run_number }}"
          body: "Automatisch gebaut aus ${{ github.sha }}. Zum Installieren die APK auf dem Handy öffnen."
          files: punkt-*.apk
          make_latest: true
